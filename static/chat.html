<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChickenCoop Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #222; color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Auth Screen */
        #auth-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .auth-box { background: #333; padding: 30px; border-radius: 8px; width: 320px; text-align: center; }
        .auth-box input, .auth-box select { width: 90%; padding: 10px; margin: 8px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; }
        .auth-box button { width: 95%; padding: 10px; background: #ff6600; border: none; color: #fff; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .file-upload-label { display: block; font-size: 0.85rem; color: #aaa; margin-top: 5px; text-align: left; padding-left: 15px; }
        .auth-note { font-size: 0.75rem; color: #888; margin-top: 15px; line-height: 1.3; }

        /* Main Chat Layout */
        #app-container { display: flex; width: 100%; height: 100%; display: none; position: relative; }
        
        /* Left Sidebar (Orange) */
        .sidebar { width: 280px; background: #ff6600; display: flex; flex-direction: column; border-right: 2px solid #111; z-index: 10; }
        .user-profile { padding: 15px; background: #e55c00; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #111; }
        .user-info { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
        .user-info img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; background: #333; }
        .logout-btn { background: #222; border: none; color: #fff; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; text-decoration: none; display: inl[...] 
        
        .sidebar-section-title { padding: 10px 15px; font-size: 0.8rem; text-transform: uppercase; background: #d45200; font-weight: bold; letter-spacing: 0.5px; }
        .friends-list { overflow-y: auto; flex: 1; }
        .friend-item { padding: 12px 15px; border-bottom: 2px solid #111; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-weight: bold; transition: backgr[...] 
        .friend-item:hover { background: #e55c00; }
        .friend-left { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .friend-left img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: #333; flex-shrink: 0; }

        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #555; display: inline-block; flex-shrink: 0; }
        .status-dot.online { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }

        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #333; position: relative; }
        .chat-header { padding: 12px 15px; background: #2a2a2a; border-bottom: 2px solid #222; display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; font-weight: b[...] 
        .chat-header-info { display: flex; flex-direction: column; gap: 2px; }
        .chat-actions { display: flex; align-items: center; gap: 10px; }
        .call-btn { background: #444; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
        .call-btn:hover { background: #555; }
        .menu-btn { background: #444; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
        
        .messages-container-wrapper { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>
  <canvas id="bg-dots-canvas" aria-hidden="true"></canvas>

  <div id="auth-container"> <!-- simplified placeholder, actual content below will populate -->
    <!-- auth UI could be here -->
  </div>

  <div id="app-container">
    <!-- Actual chat UI will go here -->
  </div>

  <script src="/assets/js/bg-dots.js"></script>
  <script src="/assets/js/mg-pxy.js"></script>
  <script src="/assets/js/index-3.js"></script>
</body>
</html>
