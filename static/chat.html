<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChickenCoop Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #222; color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Auth Screen */
        #auth-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .auth-box { background: #333; padding: 30px; border-radius: 8px; width: 320px; text-align: center; }
        .auth-box input, .auth-box select { width: 90%; padding: 10px; margin: 8px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; }
        .auth-box button { width: 95%; padding: 10px; background: #ff6600; border: none; color: #fff; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .file-upload-label { display: block; font-size: 0.85rem; color: #aaa; margin-top: 5px; text-align: left; padding-left: 15px; }

        /* Main Chat Layout */
        #app-container { display: flex; width: 100%; height: 100%; display: none; position: relative; }
        
        /* Left Sidebar (Orange) */
        .sidebar { width: 280px; background: #ff6600; display: flex; flex-direction: column; border-right: 2px solid #111; z-index: 10; }
        .user-profile { padding: 15px; background: #e55c00; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #111; }
        .user-info { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
        .user-info img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; background: #333; }
        .logout-btn { background: #222; border: none; color: #fff; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; text-decoration: none; display: inline-block; }
        
        .sidebar-section-title { padding: 10px 15px; font-size: 0.8rem; text-transform: uppercase; background: #d45200; font-weight: bold; letter-spacing: 0.5px; }
        .friends-list { overflow-y: auto; flex: 1; }
        .friend-item { padding: 12px 15px; border-bottom: 2px solid #111; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-weight: bold; transition: background 0.2s; background: #ff6600; }
        .friend-item:hover { background: #e55c00; }
        .friend-left { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .friend-left img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: #333; flex-shrink: 0; }
        
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #555; display: inline-block; flex-shrink: 0; }
        .status-dot.online { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }

        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #333; position: relative; }
        .chat-header { padding: 12px 15px; background: #2a2a2a; border-bottom: 2px solid #222; display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; font-weight: bold; }
        .chat-header-info { display: flex; flex-direction: column; gap: 2px; }
        .chat-actions { display: flex; align-items: center; gap: 10px; }
        .call-btn { background: #444; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
        .call-btn:hover { background: #555; }
        .menu-btn { background: #444; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
        
        .messages-container-wrapper { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        /* Typing Indicator */
        .typing-indicator-container {
            position: absolute; bottom: 10px; left: 20px; display: none; align-items: center; gap: 8px;
            background: rgba(25, 25, 25, 0.85); padding: 6px 12px; border-radius: 20px;
            border: 1px solid #444; font-size: 0.85rem; color: #ccc; z-index: 5; backdrop-filter: blur(4px);
        }
        .typing-pfp { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: #222; }
        .bouncing-dots { display: flex; align-items: center; gap: 3px; margin-left: 2px; }
        .bouncing-dots span {
            width: 5px; height: 5px; background-color: #ff6600; border-radius: 50%;
            display: inline-block; animation: bounce 1.4s infinite ease-in-out both;
        }
        .bouncing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .bouncing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .message-wrapper { display: flex; align-items: flex-end; gap: 8px; max-width: 60%; }
        .message-wrapper.sent { align-self: flex-end; flex-direction: row-reverse; }
        .message-wrapper.received { align-self: flex-start; }
        
        .msg-pfp { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; margin-bottom: 2px; background: #222; cursor: pointer; flex-shrink: 0; }
        .message { padding: 10px 14px; border-radius: 8px; word-break: break-word; color: #fff; }
        .message.sent { background: #ff6600; }
        .message.received { background: #444; }
        .message img { max-width: 200px; border-radius: 6px; display: block; margin-top: 4px; }

        .chat-input-box { padding: 15px; background: #2a2a2a; display: flex; gap: 10px; align-items: center; }
        .chat-input-box input[type="text"] { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #1a1a1a; color: #fff; outline: none; }
        .file-input-btn { background: #444; color: #fff; border: none; padding: 10px 14px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        .file-input-btn:hover { background: #555; }
        .chat-input-box button.send-btn { padding: 0 20px; height: 42px; background: #ff6600; border: none; color: #fff; border-radius: 20px; cursor: pointer; font-weight: bold; }

        /* Right Collapsing Menu */
        .right-menu { position: absolute; top: 0; right: -320px; width: 320px; height: 100%; background: #252525; border-left: 2px solid #111; transition: right 0.3s ease; display: flex; flex-direction: column; z-index: 50; padding: 20px; overflow-y: auto; }
        .right-menu.open { right: 0; }
        .menu-header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 15px; }
        .right-menu h3 { margin: 0 0 10px 0; border: none; padding: 0; font-size: 1rem; }
        .close-menu-btn { background: none; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; }
        .close-menu-btn:hover { color: #fff; }

        .search-group { display: flex; gap: 5px; margin-bottom: 5px; }
        .search-group input { flex: 1; padding: 8px; background: #151515; border: 1px solid #444; color: #fff; border-radius: 4px; }
        .search-group button { padding: 8px 12px; background: #ff6600; border: none; color: #fff; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .request-status { font-size: 0.85rem; margin-bottom: 20px; min-height: 18px; }
        
        .request-item { display: flex; justify-content: space-between; align-items: center; background: #333; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
        .request-actions { display: flex; gap: 5px; }
        .accept-btn { background: #2ecc71; border: none; color: #fff; padding: 5px 8px; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .reject-btn { background: #e74c3c; border: none; color: #fff; padding: 5px 8px; border-radius: 3px; cursor: pointer; font-weight: bold; }

        /* Profile Modal */
        #profile-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .profile-card { background: #252525; border: 1px solid #444; padding: 30px; border-radius: 12px; width: 300px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .profile-card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #111; border: 2px solid #ff6600; }
        .profile-card h2 { margin: 0; font-size: 1.4rem; }
        .profile-card p { color: #aaa; font-size: 0.9rem; margin: 0; }
        .profile-card button { padding: 8px 16px; background: #ff6600; border: none; color: #fff; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* Call Window & Ringing Overlay */
        #call-window { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 99999; flex-direction: column; justify-content: center; align-items: center; }
        .video-grid { display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
        .video-grid video { width: 400px; height: 300px; background: #111; border-radius: 12px; object-fit: cover; border: 2px solid #444; }
    </style>
</head>
<body>

    <!-- Authentication Screen -->
    <div id="auth-container">
        <div class="auth-box">
            <h2 id="auth-title">Login</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <input type="text" id="pfp" placeholder="Profile Picture URL (Optional)">
            <label class="file-upload-label">Or upload PFP from storage:</label>
            <input type="file" id="pfp-file" accept="image/*" onchange="handleFilePfpUpload(event)">
            <button onclick="handleAuth()" id="auth-btn">Log In</button>
            <p style="cursor:pointer; font-size:0.9rem; margin-top:15px; color:#aaa;" onclick="toggleAuthMode()">Need an account? Register</p>
        </div>
    </div>

    <!-- Profile Viewer Modal -->
    <div id="profile-modal" onclick="closeProfileModal()">
        <div class="profile-card" onclick="event.stopPropagation()">
            <img id="modal-pfp" src="" alt="Profile Picture">
            <h2 id="modal-username">Username</h2>
            <p id="modal-status">No status set</p>
            <button onclick="closeProfileModal()">Close</button>
        </div>
    </div>

    <!-- Call Window & Ringing Overlay -->
    <div id="call-window">
        <!-- Ringing / Calling Screen State -->
        <div id="call-ringing-state" style="display: flex; flex-direction: column; align-items: center; gap: 15px; text-align: center;">
            <img id="call-target-pfp" src="" alt="Calling..." style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #ff6600; background: #222;">
            <h2 id="call-status-text" style="margin: 0; font-size: 1.5rem;">Calling...</h2>
            <p id="call-target-username" style="color: #aaa; font-size: 1.1rem; margin: 0;"></p>
            <button id="cancel-call-btn" onclick="cancelOrEndCall()" style="background: #e74c3c; border: none; color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;">Cancel Call</button>
        </div>

        <!-- Active Video/Voice Stream State -->
        <div id="call-active-state" style="display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%;">
            <div class="video-grid">
                <video id="local-video" autoplay muted playsinline></video>
                <video id="remote-video" autoplay playsinline></video>
            </div>
            <button id="end-call-btn" onclick="cancelOrEndCall()" style="background: #e74c3c; border: none; color: white; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;">End Call</button>
        </div>
    </div>

    <!-- Incoming Call Chat Popup Banner -->
    <div id="incoming-call-banner" style="display: none; position: fixed; top: 20px; right: 20px; background: #252525; border: 2px solid #ff6600; padding: 15px 20px; border-radius: 10px; z-index: 10000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); align-items: center; gap: 15px;">
        <img id="incoming-caller-pfp" src="" style="width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #111;">
        <div>
            <p id="incoming-call-text" style="margin: 0 0 5px 0; font-weight: bold; font-size: 0.95rem; color: #fff;">Incoming Call</p>
            <div style="display: flex; gap: 8px;">
                <button onclick="acceptIncomingCall()" style="background: #2ecc71; border: none; color: #fff; padding: 5px 12px; border-radius: 4px; font-weight: bold; cursor: pointer;">Accept</button>
                <button onclick="rejectIncomingCall()" style="background: #e74c3c; border: none; color: #fff; padding: 5px 12px; border-radius: 4px; font-weight: bold; cursor: pointer;">Reject</button>
            </div>
        </div>
    </div>

    <!-- Main Application Container -->
    <div id="app-container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="user-profile">
                <div class="user-info" onclick="openMyProfile()">
                    <img id="my-pfp" src="" alt="pfp">
                    <span id="my-username">User</span>
                </div>
                <a href="https://chickencoopproxy.vercel.app" class="logout-btn">Logout</a>
            </div>
            
            <div class="sidebar-section-title">Rooms</div>
            <div class="friend-item" onclick="selectGlobalChat()">
                <div class="friend-left">
                    <div style="width: 30px; height: 30px; border-radius: 50%; background: #ff6600; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff;">G</div>
                    <span>Global Chatroom</span>
                </div>
            </div>

            <div class="sidebar-section-title">Direct Messages</div>
            <div class="friends-list" id="friends-list">
                <!-- Friends populated here -->
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-header-info">
                    <span id="chat-target-name">Select a friend or room to chat</span>
                </div>
                <div class="chat-actions">
                    <button class="call-btn" onclick="startCall(false)">Voice Call</button>
                    <button class="call-btn" onclick="startCall(true)">Video Call</button>
                    <button class="menu-btn" onclick="toggleRightMenu()">Menu</button>
                </div>
            </div>
            
            <div class="messages-container-wrapper">
                <div class="messages-box" id="messages-box">
                    <!-- Messages go here -->
                </div>
                
                <!-- Typing Indicator -->
                <div id="typing-indicator" class="typing-indicator-container">
                    <img id="typing-pfp" class="typing-pfp" src="" alt="">
                    <span id="typing-text">username is typing</span>
                    <div class="bouncing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>

            <div class="chat-input-box">
                <label class="file-input-btn">
                    Upload Image<input type="file" id="image-file-input" accept="image/*" style="display:none" onchange="sendImageMessage(event)">
                </label>
                <input type="text" id="message-input" placeholder="Type a message..." oninput="emitTyping()" onkeypress="checkEnter(event)">
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>

            <!-- Right Collapsing Menu -->
            <div class="right-menu" id="right-menu">
                <div class="menu-header-row">
                    <h3>Add Friend</h3>
                    <button class="close-menu-btn" onclick="toggleRightMenu()">X</button>
                </div>
                <div class="search-group">
                    <input type="text" id="friend-search-input" placeholder="Enter username...">
                    <button onclick="sendFriendRequest()">Add</button>
                </div>
                <div id="request-status" class="request-status"></div>

                <h3>Friend Requests</h3>
                <div id="requests-list">
                    <!-- Pending friend requests populate here -->
                </div>

                <h3 style="margin-top:20px;">Create Group Chat</h3>
                <div class="search-group">
                    <input type="text" id="group-name-input" placeholder="Group name...">
                    <button onclick="createGroupChat()">Create</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://coopserver1.b-cdn.net";
        let socket;
        let currentUser = null;
        let currentChatType = null; // 'global', 'dm', 'group'
        let currentReceiver = null; // friend object or group object
        let isRegistering = false;
        let uploadedPfpData = "";
        let typingTimer = null;
        let onlineUsers = new Set();

        // Virtual Gemini Bot Definition
        const geminiBot = {
            id: -999,
            username: "Gemini AI",
            pfp: "https://www.gstatic.com/lamda/images/gemini_sparkle_v002_d4735304ff6292a690345.svg",
            status_text: "Always online and ready to chat!"
        };

        // WebRTC & Calling State
        let localStream = null;
        let remoteStream = null;
        let peerConnection = null;
        let callTimeout = null;
        let incomingCallData = null;
        let activeCallTargetId = null;
        let isVideoCallActive = false;

        const rtcServers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function toggleAuthMode() {
            isRegistering = !isRegistering;
            document.getElementById('auth-title').innerText = isRegistering ? 'Register' : 'Login';
            document.getElementById('auth-btn').innerText = isRegistering ? 'Sign Up' : 'Log In';
            document.querySelector('.auth-box p').innerText = isRegistering ? 'Already have an account? Login' : 'Need an account? Register';
        }

        function handleFilePfpUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedPfpData = e.target.result;
                document.getElementById('pfp').value = "[Stored Image File Selected]";
            };
            reader.readAsDataURL(file);
        }

        async function handleAuth() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            let pfp = uploadedPfpData || document.getElementById('pfp').value.trim();
            if (pfp === "[Stored Image File Selected]") pfp = uploadedPfpData;
            
            const endpoint = isRegistering ? '/api/register' : '/api/login';

            try {
                const res = await fetch(BACKEND_URL + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, pfp })
                });

                const data = await res.json();
                if (data.error) {
                    alert(data.error);
                } else {
                    currentUser = data.user;
                    initApp();
                }
            } catch (err) {
                alert("Error: Network issue or server unreachable");
            }
        }

        function initApp() {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            
            document.getElementById('my-username').innerText = currentUser.username;
            
            const myPfpImg = document.getElementById('my-pfp');
            const fallbackMyPfp = `https://api.dicebear.com/7.x/identicon/svg?seed=${currentUser.username}`;
            myPfpImg.src = currentUser.pfp || fallbackMyPfp;
            myPfpImg.onerror = () => { myPfpImg.onerror = null; myPfpImg.src = fallbackMyPfp; };

            socket = io(BACKEND_URL);
            socket.emit('join_room', currentUser.id);

            socket.on('presence_update', (data) => {
                if (data.status === 'online') onlineUsers.add(data.userId);
                else onlineUsers.delete(data.userId);
                updatePresenceUI();
            });

            socket.on('receive_message', (data) => {
                if (currentChatType === 'dm' && currentReceiver && (data.sender_id === currentReceiver.id || data.receiver_id === currentReceiver.id)) {
                    const isSent = data.sender_id === currentUser.id;
                    const pfpSource = isSent ? currentUser.pfp : currentReceiver.pfp;
                    appendMessage(data.message, isSent ? 'sent' : 'received', pfpSource, data.sender_id);
                }
            });

            socket.on('receive_global_message', (data) => {
                if (currentChatType === 'global') {
                    const isSent = data.sender_id === currentUser.id;
                    appendMessage(data.message, isSent ? 'sent' : 'received', data.pfp, data.sender_id);
                }
            });

            socket.on('display_typing', (data) => {
                if (currentChatType === 'dm' && currentReceiver && data.sender_id === currentReceiver.id) {
                    const typingContainer = document.getElementById('typing-indicator');
                    const typingText = document.getElementById('typing-text');
                    const typingPfp = document.getElementById('typing-pfp');
                    
                    const fallback = `https://api.dicebear.com/7.x/identicon/svg?seed=${currentReceiver.username}`;
                    typingPfp.src = currentReceiver.pfp || fallback;
                    typingPfp.onerror = () => { typingPfp.onerror = null; typingPfp.src = fallback; };
                    
                    typingText.innerText = `${currentReceiver.username} is typing`;
                    typingContainer.style.display = 'flex';
                }
            });

            socket.on('hide_typing', (data) => {
                if (currentChatType === 'dm' && currentReceiver && data.sender_id === currentReceiver.id) {
                    document.getElementById('typing-indicator').style.display = 'none';
                }
            });

            // --- WebRTC Signaling Listeners ---
            socket.on('call-ring', data => {
                incomingCallData = data;
                const banner = document.getElementById('incoming-call-banner');
                const callerPfp = document.getElementById('incoming-caller-pfp');
                const fallback = `https://api.dicebear.com/7.x/identicon/svg?seed=${data.fromUser.username}`;
                
                callerPfp.src = data.fromUser.pfp || fallback;
                callerPfp.onerror = () => { callerPfp.onerror = null; callerPfp.src = fallback; };
                document.getElementById('incoming-call-text').innerText = `Incoming ${data.isVideo ? 'video' : 'voice'} call from ${data.fromUser.username}`;
                banner.style.display = 'flex';
            });

            socket.on('call-cancelled', () => {
                hideIncomingBanner();
                if (document.getElementById('call-window').style.display === 'flex') {
                    document.getElementById('call-status-text').innerText = "Call ended / No answer";
                    setTimeout(closeCallWindow, 2000);
                }
            });

            socket.on('call-accepted', async () => {
                clearTimeout(callTimeout);
                document.getElementById('call-status-text').innerText = "Connected!";

                try {
                    await startMediaStream(isVideoCallActive);
                    createPeerConnection(activeCallTargetId);

                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    socket.emit('call-offer', { offer, to: activeCallTargetId });

                    setTimeout(() => {
                        document.getElementById('call-ringing-state').style.display = 'none';
                        document.getElementById('call-active-state').style.display = 'flex';
                    }, 800);
                } catch (e) {
                    cancelOrEndCall();
                }
            });

            socket.on('call-rejected', () => {
                clearTimeout(callTimeout);
                document.getElementById('call-status-text').innerText = "Call Declined";
                setTimeout(closeCallWindow, 2000);
            });

            socket.on('call-offer', async data => {
                if (peerConnection) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.emit('call-answer', { answer, to: activeCallTargetId });

                    document.getElementById('call-ringing-state').style.display = 'none';
                    document.getElementById('call-active-state').style.display = 'flex';
                }
            });

            socket.on('call-answer', async data => {
                if (peerConnection) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    document.getElementById('call-ringing-state').style.display = 'none';
                    document.getElementById('call-active-state').style.display = 'flex';
                }
            });

            socket.on('ice-candidate', async data => {
                if (peerConnection && data.candidate) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            });

            socket.on('call-ended', () => {
                closeCallWindow();
            });

            loadFriends();
            loadRequests();
            selectGlobalChat();
            
            setInterval(() => {
                loadFriends();
                loadRequests();
            }, 5000);
        }

        // --- WebRTC & Calling Functions ---
        async function startCall(isVideo) {
            if (currentChatType !== 'dm' || !currentReceiver) {
                alert("Select a direct friend chat to start a call.");
                return;
            }

            if (currentReceiver.id === -999) {
                alert("You cannot call Gemini AI!");
                return;
            }

            activeCallTargetId = currentReceiver.id;
            isVideoCallActive = isVideo;

            document.getElementById('call-window').style.display = 'flex';
            document.getElementById('call-ringing-state').style.display = 'flex';
            document.getElementById('call-active-state').style.display = 'none';
            
            document.getElementById('call-status-text').innerText = "Calling...";
            document.getElementById('call-target-username').innerText = currentReceiver.username;
            
            const fallback = `https://api.dicebear.com/7.x/identicon/svg?seed=${currentReceiver.username}`;
            const targetPfpImg = document.getElementById('call-target-pfp');
            targetPfpImg.src = currentReceiver.pfp || fallback;
            targetPfpImg.onerror = () => { targetPfpImg.onerror = null; targetPfpImg.src = fallback; };

            socket.emit('call-ring', {
                to: activeCallTargetId,
                fromUser: {
                    id: currentUser.id,
                    username: currentUser.username,
                    pfp: currentUser.pfp
                },
                isVideo: isVideo
            });

            callTimeout = setTimeout(() => {
                document.getElementById('call-status-text').innerText = "No response";
                socket.emit('cancel-call', { to: activeCallTargetId });
                setTimeout(() => {
                    closeCallWindow();
                }, 2000);
            }, 10000);
        }

        function hideIncomingBanner() {
            document.getElementById('incoming-call-banner').style.display = 'none';
        }

        async function acceptIncomingCall() {
            hideIncomingBanner();
            if (!incomingCallData) return;

            activeCallTargetId = incomingCallData.fromUser.id;
            isVideoCallActive = incomingCallData.isVideo;

            document.getElementById('call-window').style.display = 'flex';
            document.getElementById('call-ringing-state').style.display = 'flex';
            document.getElementById('call-active-state').style.display = 'none';
            document.getElementById('call-status-text').innerText = "Connecting...";
            document.getElementById('call-target-username').innerText = incomingCallData.fromUser.username;
            
            const fallback = `https://api.dicebear.com/7.x/identicon/svg?seed=${incomingCallData.fromUser.username}`;
            const targetPfpImg = document.getElementById('call-target-pfp');
            targetPfpImg.src = incomingCallData.fromUser.pfp || fallback;
            targetPfpImg.onerror = () => { targetPfpImg.onerror = null; targetPfpImg.src = fallback; };

            try {
                await startMediaStream(isVideoCallActive);
                createPeerConnection(activeCallTargetId);
                socket.emit('accept-call', { to: activeCallTargetId });
            } catch (err) {
                cancelOrEndCall();
            }
        }

        function rejectIncomingCall() {
            hideIncomingBanner();
            if (incomingCallData) {
                socket.emit('reject-call', { to: incomingCallData.fromUser.id });
            }
            incomingCallData = null;
        }

        async function startMediaStream(isVideo) {
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: isVideo ? { width: 1280, height: 720 } : false
            });
            document.getElementById('local-video').srcObject = localStream;
        }

        function createPeerConnection(targetId) {
            if (peerConnection) peerConnection.close();
            peerConnection = new RTCPeerConnection(rtcServers);

            remoteStream = new MediaStream();
            document.getElementById('remote-video').srcObject = remoteStream;

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = event => {
                event.streams[0].getTracks().forEach(track => {
                    remoteStream.addTrack(track);
                });
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { candidate: event.candidate, to: targetId });
                }
            };
        }

        function cancelOrEndCall() {
            if (activeCallTargetId) {
                socket.emit('end-call', { to: activeCallTargetId });
            }
            closeCallWindow();
        }

        function closeCallWindow() {
            clearTimeout(callTimeout);
            hideIncomingBanner();
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            activeCallTargetId = null;
            document.getElementById('call-window').style.display = 'none';
            document.getElementById('local-video').srcObject = null;
            document.getElementById('remote-video').srcObject = null;
        }

        // --- UI & Chat Helpers ---
        function updatePresenceUI() {
            document.querySelectorAll('.friend-item').forEach(item => {
                const userId = item.getAttribute('data-userid');
                const dot = item.querySelector('.status-dot');
                if (dot && userId) {
                    if (userId === "-999" || onlineUsers.has(parseInt(userId))) {
                        dot.classList.add('online');
                    } else {
                        dot.classList.remove('online');
                    }
                }
            });
        }

        function emitTyping() {
            if (currentChatType !== 'dm' || !currentReceiver || !currentUser) return;
            if (currentReceiver.id === -999) return; // Don't emit socket typing for bot

            socket.emit('typing', { sender_id: currentUser.id, receiver_id: currentReceiver.id });

            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                socket.emit('stop_typing', { sender_id: currentUser.id, receiver_id: currentReceiver.id });
            }, 1500);
        }

        async function loadFriends() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/friends/${currentUser.id}`);
                const friends = await res.json();
                const listEl = document.getElementById('friends-list');
                listEl.innerHTML = '';

                // Combine Gemini at the top with regular friends list
                const allFriends = [geminiBot, ...friends];

                allFriends.forEach(f => {
                    const item = document.createElement('div');
                    item.className = 'friend-item';
                    item.setAttribute('data-userid', f.id);
                    const fallback = `https://api.dicebear.com/7.x/identicon/svg?seed=${f.username}`;
                    const avatarUrl = f.pfp || fallback;
                    
                    const isOnline = (f.id === -999 || onlineUsers.has(f.id)) ? 'online' : '';

                    item.innerHTML = `
                        <div class="friend-left">
                            <img src="${avatarUrl}" onerror="this.onerror=null; this.src='${fallback}';"> 
                            <span>${f.username}</span>
                        </div>
                        <span class="status-dot ${isOnline}"></span>
                    `;
                    item.onclick = () => selectFriend(f);
                    listEl.appendChild(item);
                });
            } catch (e) {}
        }

        async function loadRequests() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/friends/requests/${currentUser.id}`);
                const requests = await res.json();
                const listEl = document.getElementById('requests-list');
                listEl.innerHTML = '';

                if (requests.length === 0) {
                    listEl.innerHTML = '<p style="color:#888; font-size:0.9rem;">No pending requests</p>';
                    return;
                }

                requests.forEach(req => {
                    const item = document.createElement('div');
                    item.className = 'request-item';
                    item.innerHTML = `
                        <span>${req.username}</span>
                        <div class="request-actions">
                            <button class="accept-btn" onclick="respondRequest(${req.id}, 'accept')">Accept</button>
                            <button class="reject-btn" onclick="respondRequest(${req.id}, 'reject')">Reject</button>
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            } catch (e) {}
        }

        async function sendFriendRequest() {
            const usernameQuery = document.getElementById('friend-search-input').value.trim();
            const statusEl = document.getElementById('request-status');
            if (!usernameQuery) return;

            statusEl.style.color = "#aaa";
            statusEl.innerText = "Searching...";

            try {
                const searchRes = await fetch(`${BACKEND_URL}/api/users/search?q=${encodeURIComponent(usernameQuery)}`);
                if (!searchRes.ok) {
                    statusEl.style.color = "#e74c3c";
                    statusEl.innerText = "Error";
                    return;
                }
                const users = await searchRes.json();
                const targetUser = users.find(u => u.username.toLowerCase() === usernameQuery.toLowerCase());

                if (!targetUser) {
                    statusEl.style.color = "#e74c3c";
                    statusEl.innerText = "User not found";
                    return;
                }

                const res = await fetch(`${BACKEND_URL}/api/friends/request`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender_id: currentUser.id, receiver_id: targetUser.id })
                });

                if (res.ok) {
                    statusEl.style.color = "#2ecc71";
                    statusEl.innerText = "Request Sent";
                    document.getElementById('friend-search-input').value = '';
                } else {
                    statusEl.style.color = "#e74c3c";
                    statusEl.innerText = "Error sending request";
                }
            } catch (err) {
                statusEl.style.color = "#e74c3c";
                statusEl.innerText = "Error";
            }
        }

        async function respondRequest(senderId, action) {
            try {
                await fetch(`${BACKEND_URL}/api/friends/respond`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser.id, sender_id: senderId, action })
                });
                loadRequests();
                loadFriends();
            } catch (e) {}
        }

        async function createGroupChat() {
            const name = document.getElementById('group-name-input').value.trim();
            if (!name) return;
            try {
                const res = await fetch(`${BACKEND_URL}/api/groups/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, admin_id: currentUser.id, member_ids: [] })
                });
                if (res.ok) {
                    document.getElementById('group-name-input').value = '';
                    alert('Group created successfully!');
                }
            } catch (e) {}
        }

        async function selectGlobalChat() {
            currentChatType = 'global';
            currentReceiver = null;
            document.getElementById('chat-target-name').innerText = 'Global Chatroom';
            document.getElementById('typing-indicator').style.display = 'none';

            try {
                const res = await fetch(`${BACKEND_URL}/api/messages/global`);
                const messages = await res.json();
                const box = document.getElementById('messages-box');
                box.innerHTML = '';
                messages.forEach(m => {
                    const isSent = m.sender_id === currentUser.id;
                    appendMessage(m.message, isSent ? 'sent' : 'received', m.pfp, m.sender_id);
                });
            } catch (e) {}
        }

        async function selectFriend(friend) {
            currentChatType = 'dm';
            currentReceiver = friend;
            document.getElementById('chat-target-name').innerText = friend.username;
            document.getElementById('typing-indicator').style.display = 'none';
            
            // If Gemini is selected, just clear messages box (or you can keep a local memory buffer)
            if (friend.id === -999) {
                const box = document.getElementById('messages-box');
                box.innerHTML = '';
                appendMessage("Hello! I'm Gemini AI. How can I help you today?", 'received', geminiBot.pfp, geminiBot.id);
                return;
            }

            try {
                const res = await fetch(`${BACKEND_URL}/api/messages/${currentUser.id}/${friend.id}`);
                const messages = await res.json();
                const box = document.getElementById('messages-box');
                box.innerHTML = '';
                
                messages.forEach(m => {
                    const isSent = m.sender_id === currentUser.id;
                    const pfpSource = isSent ? currentUser.pfp : friend.pfp;
                    appendMessage(m.message, isSent ? 'sent' : 'received', pfpSource, m.sender_id);
                });
            } catch (e) {}
        }

        async function viewUserProfile(userId) {
            if (userId === -999) {
                openMyProfile(); // Or custom view for Gemini
                return;
            }
            try {
                const res = await fetch(`${BACKEND_URL}/api/users/search?q=`);
                const users = await res.json();
                const target = users.find(u => u.id === userId);
                if (target) {
                    const fallback = `https://api.dicebear.com/7.x/identicon/svg?seed=${target.username}`;
                    document.getElementById('modal-pfp').src = target.pfp || fallback;
                    document.getElementById('modal-username').innerText = target.username;
                    document.getElementById('modal-status').innerText = target.status_text || 'No status set';
                    document.getElementById('profile-modal').style.display = 'flex';
                }
            } catch (e) {}
        }

        function openMyProfile() {
            const fallback = `https://api.dicebear.com/7.x/identicon/svg?seed=${currentUser.username}`;
            document.getElementById('modal-pfp').src = currentUser.pfp || fallback;
            document.getElementById('modal-username').innerText = currentUser.username;
            document.getElementById('modal-status').innerText = currentUser.status_text || 'No status set';
            document.getElementById('profile-modal').style.display = 'flex';
        }

        function closeProfileModal() {
            document.getElementById('profile-modal').style.display = 'none';
        }

        function appendMessage(content, type, pfpUrl, senderId) {
            const box = document.getElementById('messages-box');
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${type}`;

            const fallbackPfp = `https://api.dicebear.com/7.x/identicon/svg?seed=user`;
            
            const pfpImg = document.createElement('img');
            pfpImg.className = 'msg-pfp';
            pfpImg.src = pfpUrl || fallbackPfp;
            pfpImg.onerror = () => { pfpImg.onerror = null; pfpImg.src = fallbackPfp; };
            if (senderId) {
                pfpImg.onclick = () => viewUserProfile(senderId);
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;

            if (content.startsWith('data:image')) {
                const img = document.createElement('img');
                img.src = content;
                msgDiv.appendChild(img);
            } else {
                msgDiv.innerText = content;
            }

            if (type === 'received') {
                wrapper.appendChild(pfpImg);
                wrapper.appendChild(msgDiv);
            } else {
                wrapper.appendChild(msgDiv);
                wrapper.appendChild(pfpImg);
            }

            box.appendChild(wrapper);
            box.scrollTop = box.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message) return;

            // --- IF CHATTING WITH GEMINI AI ---
            if (currentChatType === 'dm' && currentReceiver && currentReceiver.id === -999) {
                appendMessage(message, 'sent', currentUser.pfp, currentUser.id);
                input.value = '';

                // Show typing indicator
                const typingContainer = document.getElementById('typing-indicator');
                const typingText = document.getElementById('typing-text');
                const typingPfp = document.getElementById('typing-pfp');
                
                typingPfp.src = geminiBot.pfp;
                typingText.innerText = "Gemini AI is thinking";
                typingContainer.style.display = 'flex';

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=AQ.Ab8RN6IQOdcp2WW2YduntMK9YCeZh2R69z-FIl-yDem5v2fMNw`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: message }] }]
                        })
                    });
                    const data = await response.json();
                    const aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Hmm, I couldn't generate a response.";

                    typingContainer.style.display = 'none';
                    appendMessage(aiReply, 'received', geminiBot.pfp, geminiBot.id);
                } catch (err) {
                    typingContainer.style.display = 'none';
                    appendMessage("Error communicating with Gemini.", 'received', geminiBot.pfp, geminiBot.id);
                }
                return;
            }

            // --- NORMAL MESSAGING LOGIC ---
            if (currentChatType === 'global') {
                socket.emit('send_global_message', {
                    sender_id: currentUser.id,
                    message: message,
                    username: currentUser.username,
                    pfp: currentUser.pfp
                });
                appendMessage(message, 'sent', currentUser.pfp, currentUser.id);
            } else if (currentChatType === 'dm') {
                socket.emit('send_message', {
                    sender_id: currentUser.id,
                    receiver_id: currentReceiver.id,
                    message: message
                });
                socket.emit('stop_typing', { sender_id: currentUser.id, receiver_id: currentReceiver.id });
                appendMessage(message, 'sent', currentUser.pfp, currentUser.id);
            }

            input.value = '';
        }

        function sendImageMessage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                appendMessage(base64Image, 'sent', currentUser.pfp, currentUser.id);

                if (currentChatType === 'global') {
                    socket.emit('send_global_message', {
                        sender_id: currentUser.id,
                        message: base64Image,
                        username: currentUser.username,
                        pfp: currentUser.pfp
                    });
                } else if (currentChatType === 'dm' && currentReceiver.id !== -999) {
                    socket.emit('send_message', {
                        sender_id: currentUser.id,
                        receiver_id: currentReceiver.id,
                        message: base64Image
                    });
                }
            };
            reader.readAsDataURL(file);
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function toggleRightMenu() {
            const menu = document.getElementById('right-menu');
            menu.classList.toggle('open');
        }
    </script>
