<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChickenCoop Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: sans-serif; 
      background: #111; 
      color: #fff; 
      height: 100vh; 
      margin: 0; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }

    /* Auth Screen */
    #auth-container {
      background: #1a1a1a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 14px;
      width: 340px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #auth-container h2 { color: #ff5722; margin-top: 0; }
    #auth-container input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #222;
      color: #fff;
    }
    #auth-container button {
      width: 100%;
      padding: 12px;
      background: #ff5722;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }
    .error-msg { color: #ff4444; font-size: 13px; margin-bottom: 10px; }

    /* Chat App Layout */
    #app-container {
      display: none;
      width: 95vw;
      max-width: 1200px;
      height: 90vh;
      background: #eee;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      color: #333;
    }
    .layout { display: flex; height: 100%; position: relative; }
    
    /* Left Sidebar (Orange) */
    .sidebar {
      width: 280px;
      background: #ff5722;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 15px 20px;
      font-weight: bold;
      font-size: 16px;
      border-bottom: 2px solid rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .user-profile-info { display: flex; align-items: center; gap: 10px; }
    
    .avatar-container { position: relative; width: 34px; height: 34px; flex-shrink: 0; }
    .avatar { width: 100%; height: 100%; border-radius: 50%; background: #ddd; object-fit: cover; border: 2px solid #fff; }
    
    .status-dot {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid #ff5722;
    }
    .status-dot.online { background: #4caf50; }
    .status-dot.offline { background: #9e9e9e; }

    .user-list { flex: 1; overflow-y: auto; padding: 10px; }
    
    .user-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.2s;
    }
    .user-item:hover, .user-item.active { 
      background: rgba(0, 0, 0, 0.15);
    }

    /* Owner Badge Style */
    .owner-badge {
      background: #000;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      display: inline-block;
      vertical-align: middle;
      letter-spacing: 0.5px;
    }

    /* Main Chat Panel */
    .chat-panel { flex: 1; display: flex; flex-direction: column; background: #e0e0e0; position: relative; }
    
    .chat-header {
      padding: 15px 25px;
      background: #f5f5f5;
      border-bottom: 1px solid #ccc;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .menu-icon { font-size: 24px; cursor: pointer; color: #555; }

    #chat-box { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    
    .message { max-width: 70%; padding: 12px 18px; border-radius: 8px; line-height: 1.5; font-size: 15px; }
    .message.incoming { background: #fff; align-self: flex-start; border: 1px solid #d0d0d0; }
    .message.outgoing { background: #ff5722; color: #fff; align-self: flex-end; }
    
    #form { padding: 15px 25px; background: #f5f5f5; display: flex; gap: 15px; border-top: 1px solid #ccc; }
    #message-input {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #aaa;
      background: #fff;
      font-size: 15px;
    }
    #form button {
      padding: 0 25px;
      background: #ff5722;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    #form button:disabled { background: #aaa; cursor: not-allowed; }

    /* Foldout Menu Modal */
    #foldout-menu {
      display: none;
      position: absolute;
      top: 60px;
      right: 20px;
      width: 320px;
      background: #fff;
      border: 1px solid #ccc;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      border-radius: 8px;
      z-index: 100;
      padding: 15px;
      color: #333;
    }
    #foldout-menu h3 { margin-top: 0; font-size: 16px; color: #ff5722; }
    #foldout-menu input { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; }
    #foldout-menu button { width: 100%; padding: 8px; background: #ff5722; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    
    .request-row { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 8px; border-radius: 6px; margin-bottom: 6px; font-size: 14px; }
    .request-row button { width: auto; padding: 4px 10px; font-size: 12px; margin-left: 4px; }
  </style>
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-container">
    <h2>ChickenCoop Login</h2>
    <div id="error-msg" class="error-msg"></div>
    <input type="text" id="auth-username" placeholder="Username" maxlength="15" required />
    <input type="password" id="auth-password" placeholder="Password" required />
    <input type="text" id="auth-pfp" placeholder="PFP Image URL (optional)" />
    <input type="password" id="auth-secret" placeholder="Secret Code (Optional Owner Key)" />
    <button onclick="handleAuth('login')">Log In</button>
    <button onclick="handleAuth('register')" style="background: #333; margin-top: 8px;">Sign Up</button>
  </div>

  <!-- App Screen -->
  <div id="app-container">
    <div class="layout">
      
      <!-- Left Sidebar (Orange) -->
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="user-profile-info">
            <div class="avatar-container">
              <img id="my-avatar" class="avatar" src="" alt="pfp" />
            </div>
            <div id="current-user-display"></div>
          </div>
          <span style="cursor: pointer; font-size: 18px;" title="Log out" onclick="logout()">🚪</span>
        </div>
        <div style="padding: 10px 15px; font-size: 12px; font-weight: bold; opacity: 0.8;">FRIENDS LIST</div>
        <div id="user-list" class="user-list"></div>
      </div>

      <!-- Main Chat Area -->
      <div class="chat-panel">
        <div class="chat-header">
          <span id="chat-with-display">Select a friend</span>
          <div class="menu-icon" title="Menu" onclick="toggleMenu()">☰</div>
        </div>
        
        <!-- Foldout Menu Drawer -->
        <div id="foldout-menu">
          <h3>Add Friends</h3>
          <div id="menu-msg" style="font-size: 12px; color: #ff5722; margin-bottom: 5px;"></div>
          <input type="text" id="add-friend-input" placeholder="Enter username..." />
          <button onclick="sendFriendRequest()">Send Friend Request</button>
          
          <h3 style="margin-top: 20px;">Pending Requests</h3>
          <div id="requests-list">
            <div style="font-size: 13px; color: #777;">No pending requests</div>
          </div>
        </div>

        <div id="chat-box">
          <div style="text-align: center; color: #888; margin-top: 50px;">
            Click a friend on the orange sidebar to start chatting!
          </div>
        </div>

        <form id="form" onsubmit="sendMessage(event)">
          <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" disabled />
          <button type="submit" id="send-btn" disabled>Send</button>
        </form>
      </div>

    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const BACKEND_URL = 'https://YOUR-RENDER-BACKEND-URL.onrender.com';
    
    let socket;
    let currentUser = null;
    let currentPfp = null;
    let isOwner = 0;
    let activeChatUser = null;
    let onlineUsersList = [];
    let cachedFriends = [];

    async function handleAuth(type) {
      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const pfp = document.getElementById('auth-pfp').value.trim();
      const secretCode = document.getElementById('auth-secret').value.trim();
      const errorDiv = document.getElementById('error-msg');
      errorDiv.textContent = '';

      if (!username || !password) {
        errorDiv.textContent = 'Please fill in all fields.';
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}/api/${type}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, pfp, secretCode })
        });
        const data = await res.json();

        if (data.success) {
          currentUser = data.username;
          currentPfp = data.pfp;
          isOwner = data.is_owner;
          initChatApp();
        } else {
          errorDiv.textContent = data.error || 'Authentication failed.';
        }
      } catch (e) {
        errorDiv.textContent = 'Could not connect to server.';
      }
    }

    function initChatApp() {
      document.getElementById('auth-container').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';
      
      const userDisplay = document.getElementById('current-user-display');
      userDisplay.innerHTML = currentUser + (isOwner ? ' <span class="owner-badge">[OWNER]</span>' : '');
      document.getElementById('my-avatar').src = currentPfp;

      socket = io(BACKEND_URL);
      socket.emit('join', currentUser);

      socket.on('online_users', (users) => {
        onlineUsersList = users;
        renderSidebar();
      });

      loadFriendsData();

      socket.on('private_message', ({ sender, text }) => {
        if (activeChatUser === sender) {
          appendMessage(sender, text, 'incoming');
        }
      });
    }

    async function loadFriendsData() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/friends/${currentUser}`);
        cachedFriends = await res.json();
        renderSidebar();
      } catch (e) {
        console.error('Failed to load friends');
      }
    }

    function renderSidebar() {
      const userListEl = document.getElementById('user-list');
      const requestsListEl = document.getElementById('requests-list');
      
      userListEl.innerHTML = '';
      requestsListEl.innerHTML = '';

      let pendingCount = 0;
      let activeFriendsCount = 0;

      cachedFriends.forEach(f => {
        const friendName = f.sender === currentUser ? f.receiver : f.sender;
        
        if (f.status === 'accepted') {
          activeFriendsCount++;
          const isOnline = onlineUsersList.includes(friendName);
          const friendIsOwner = f.is_owner === 1;
          
          const div = document.createElement('div');
          div.className = `user-item ${activeChatUser === friendName ? 'active' : ''}`;
          div.innerHTML = `
            <div class="avatar-container">
              <img class="avatar" src="${f.pfp}" />
              <div class="status-dot ${isOnline ? 'online' : 'offline'}" title="${isOnline ? 'Online' : 'Offline'}"></div>
            </div>
            <span>${friendName} ${friendIsOwner ? '<span class="owner-badge">[OWNER]</span>' : ''}</span>
          `;
          div.onclick = () => selectUser(friendName);
          userListEl.appendChild(div);
        } else if (f.status === 'pending' && f.receiver === currentUser) {
          pendingCount++;
          const row = document.createElement('div');
          row.className = 'request-row';
          row.innerHTML = `<span><b>${friendName}</b></span> 
            <div>
              <button style="background:#4caf50; color:#fff; border:none; border-radius:4px;" onclick="respondRequest(${f.id}, 'accepted')">Accept</button>
              <button style="background:#f44336; color:#fff; border:none; border-radius:4px;" onclick="respondRequest(${f.id}, 'rejected')">X</button>
            </div>`;
          requestsListEl.appendChild(row);
        }
      });

      if (activeFriendsCount === 0) {
        userListEl.innerHTML = `<div style="padding:10px; font-size:13px; opacity:0.8;">No friends added yet. Open ☰ menu to add!</div>`;
      }
      if (pendingCount === 0) {
        requestsListEl.innerHTML = `<div style="font-size: 13px; color: #777;">No pending requests</div>`;
      }
    }

    async function sendFriendRequest() {
      const receiver = document.getElementById('add-friend-input').value.trim();
      const msgDiv = document.getElementById('menu-msg');
      msgDiv.textContent = '';

      if (!receiver) return;

      const res = await fetch(`${BACKEND_URL}/api/friend-request/send`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender: currentUser, receiver })
      });
      const data = await res.json();

      if (data.success) {
        msgDiv.style.color = '#4caf50';
        msgDiv.textContent = `Friend request sent to ${receiver}!`;
        document.getElementById('add-friend-input').value = '';
      } else {
        msgDiv.style.color = '#f44336';
        msgDiv.textContent = data.error;
      }
    }

    async function respondRequest(id, status) {
      await fetch(`${BACKEND_URL}/api/friend-request/respond`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, status })
      });
      loadFriendsData();
    }

    function selectUser(username) {
      activeChatUser = username;
      document.getElementById('chat-with-display').textContent = `Chat with ${username}`;
      
      const input = document.getElementById('message-input');
      input.disabled = false;
      input.focus();
      document.getElementById('send-btn').disabled = false;
      document.getElementById('chat-box').innerHTML = '';

      document.querySelectorAll('.user-item').forEach(el => {
        el.classList.toggle('active', el.textContent.includes(username));
      });
    }

    function toggleMenu() {
      const menu = document.getElementById('foldout-menu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      loadFriendsData();
    }

    function logout() {
      if (socket) socket.disconnect();
      currentUser = null;
      activeChatUser = null;
      isOwner = 0;
      document.getElementById('app-container').style.display = 'none';
      document.getElementById('auth-container').style.display = 'block';
      document.getElementById('auth-password').value = '';
      document.getElementById('auth-pfp').value = '';
      document.getElementById('auth-secret').value = '';
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !activeChatUser) return;

      socket.emit('private_message', {
        sender: currentUser,
        receiver: activeChatUser,
        text: text
      });

      appendMessage('You', text, 'outgoing');
      input.value = '';
    }

    function appendMessage(sender, text, type) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
