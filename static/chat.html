<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChickenCoop Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: sans-serif; 
      background: #111; 
      color: #fff; 
      height: 100vh; 
      margin: 0; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }

    /* Auth Screen */
    #auth-container {
      background: #1a1a1a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 14px;
      width: 320px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #auth-container h2 { color: #ff5722; margin-top: 0; }
    #auth-container input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #222;
      color: #fff;
    }
    #auth-container button {
      width: 100%;
      padding: 12px;
      background: #ff5722;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }
    .error-msg { color: #ff4444; font-size: 13px; margin-bottom: 10px; }

    /* Chat App Layout - Matches Sketch */
    #app-container {
      display: none; /* Hidden until login */
      width: 95vw;
      max-width: 1200px;
      height: 90vh;
      background: #eee; /* Sketch background is light gray */
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      color: #333; /* Default text color is dark */
    }
    .layout { display: flex; height: 100%; }
    
    /* Sidebar - Orange (Matches Sketch) */
    .sidebar {
      width: 260px;
      background: #ff5722; /* Orange from sketch */
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 20px;
      font-weight: bold;
      font-size: 20px;
      border-bottom: 2px solid rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-list { flex: 1; overflow-y: auto; padding: 10px; }
    
    /* Friend Items */
    .user-item {
      padding: 15px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 5px;
      transition: background 0.2s;
      font-weight: 500;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    /* Highlight Active User (as requested) */
    .user-item:hover, .user-item.active { 
      background: rgba(0, 0, 0, 0.15); /* Darker orange on selection */
    }

    /* Main Chat Panel - Gray (Matches Sketch) */
    .chat-panel { flex: 1; display: flex; flex-direction: column; background: #e0e0e0; }
    
    .chat-header {
      padding: 15px 25px;
      background: #f5f5f5;
      border-bottom: 1px solid #ccc;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    /* Triple-line menu button from sketch */
    .menu-icon { font-size: 24px; cursor: pointer; color: #555; }

    #chat-box { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    
    /* Messages */
    .message { max-width: 70%; padding: 12px 18px; border-radius: 8px; line-height: 1.5; font-size: 15px; }
    .message.incoming { background: #fff; align-self: flex-start; border: 1px solid #d0d0d0; }
    .message.outgoing { background: #ff5722; color: #fff; align-self: flex-end; }
    
    /* Input Area - Matches Sketch style */
    #form { padding: 15px 25px; background: #f5f5f5; display: flex; gap: 15px; border-top: 1px solid #ccc; }
    #message-input {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #aaa;
      background: #fff;
      font-size: 15px;
    }
    #form button {
      padding: 0 25px;
      background: #ff5722;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
    #form button:disabled { background: #aaa; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-container">
    <h2>ChickenCoop Login</h2>
    <div id="error-msg" class="error-msg"></div>
    <input type="text" id="auth-username" placeholder="Username" maxlength="15" required />
    <input type="password" id="auth-password" placeholder="Password" required />
    <button onclick="handleAuth('login')">Log In</button>
    <button onclick="handleAuth('register')" style="background: #333; margin-top: 8px;">Sign Up</button>
  </div>

  <!-- App Screen - Rebuilt to match sketch layout -->
  <div id="app-container">
    <div class="layout">
      <!-- Left Sidebar (Orange) -->
      <div class="sidebar">
        <div class="sidebar-header">
          <span id="current-user-display"></span>
          <span style="cursor: pointer;">←</span> <!-- Back arrow from sketch -->
        </div>
        <div id="user-list" class="user-list">
          <!-- Friends will appear here -->
        </div>
      </div>

      <!-- Main Chat Area (Gray) -->
      <div class="chat-panel">
        <div class="chat-header">
          <span id="chat-with-display">Select a friend</span>
          <!-- Triple-line menu icon from sketch -->
          <div class="menu-icon" title="Open Menu (Requests/Add)">☰</div>
        </div>
        
        <div id="chat-box">
          <!-- Welcome message before chat selected -->
          <div style="text-align: center; color: #888; margin-top: 50px;">
            Click on a friend in the sidebar to start chatting.<br><br>
            (Friend requests coming soon!)
          </div>
        </div>

        <form id="form" onsubmit="sendMessage(event)">
          <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" disabled />
          <button type="submit" id="send-btn" disabled>Send</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    // PASTE YOUR LIVE RENDER BACKEND URL HERE:
    const BACKEND_URL = 'https://YOUR-RENDER-BACKEND-URL.onrender.com';
    
    let socket;
    let currentUser = null;
    let activeChatUser = null;

    // --- Authentication Logic ---
    async function handleAuth(type) {
      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const errorDiv = document.getElementById('error-msg');
      errorDiv.textContent = '';

      if (!username || !password) {
        errorDiv.textContent = 'Please fill in all fields.';
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}/api/${type}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          currentUser = data.username;
          initChatApp();
        } else {
          errorDiv.textContent = data.error || 'Authentication failed.';
        }
      } catch (e) {
        console.error(e);
        errorDiv.textContent = 'Could not connect to server. Make sure backend is running.';
      }
    }

    // --- Main Chat App Initialization ---
    function initChatApp() {
      // Switch screens
      document.getElementById('auth-container').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';
      
      // Set header username
      document.getElementById('current-user-display').textContent = currentUser;

      // Connect Socket.io
      socket = io(BACKEND_URL);
      socket.emit('join', currentUser);

      // Listen for online user updates
      socket.on('online_users', (users) => {
        const userListEl = document.getElementById('user-list');
        userListEl.innerHTML = ''; // Clear current list

        users.forEach(user => {
          if (user === currentUser) return; // Don't show yourself in list

          const div = document.createElement('div');
          // Add 'active' class if this user is currently selected
          div.className = `user-item ${activeChatUser === user ? 'active' : ''}`;
          div.textContent = user;
          div.onclick = () => selectUser(user);
          userListEl.appendChild(div);
        });
      });

      // Listen for incoming private messages
      socket.on('private_message', ({ sender, text }) => {
        // Only show message if it's from the person we are currently chatting with
        if (activeChatUser === sender) {
          appendMessage(sender, text, 'incoming');
        }
      });
    }

    // --- Selecting a Friend to Chat ---
    function selectUser(username) {
      activeChatUser = username;
      document.getElementById('chat-with-display').textContent = `Chat with ${username}`;
      
      // Enable input
      const input = document.getElementById('message-input');
      input.disabled = false;
      input.focus();
      document.getElementById('send-btn').disabled = false;

      // Clear current chat box view
      document.getElementById('chat-box').innerHTML = '';

      // Update active state in sidebar visually
      document.querySelectorAll('.user-item').forEach(el => {
        el.classList.toggle('active', el.textContent === username);
      });
    }

    // --- Sending a Message ---
    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !activeChatUser) return;

      // Send to server
      socket.emit('private_message', {
        sender: currentUser,
        receiver: activeChatUser,
        text: text
      });

      // Append locally (outgoing style)
      appendMessage('You', text, 'outgoing');
      input.value = '';
    }

    // --- Helper to add message to HTML ---
    function appendMessage(sender, text, type) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = text;
      chatBox.appendChild(div);
      
      // Auto-scroll to bottom
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
