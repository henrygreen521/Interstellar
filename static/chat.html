<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChickenCoop Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Auth Screen */
        #auth-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .auth-box { background: #333; padding: 30px; border-radius: 8px; width: 300px; text-align: center; }
        .auth-box input { width: 90%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; }
        .auth-box button { width: 95%; padding: 10px; background: #ff6600; border: none; color: #fff; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }

        /* Main Chat Layout */
        #app-container { display: flex; width: 100%; height: 100%; display: none; }
        
        /* Orange Sidebar */
        .sidebar { width: 280px; background: #ff6600; display: flex; flex-direction: column; border-right: 2px solid #111; }
        .user-profile { padding: 15px; background: #e55c00; display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1.2rem; }
        .user-profile img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .friends-list { overflow-y: auto; flex: 1; }
        .friend-item { padding: 15px; border-bottom: 1px solid rgba(0,0,0,0.2); cursor: pointer; transition: background 0.2s; }
        .friend-item:hover { background: rgba(0,0,0,0.1); }

        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #333; }
        .chat-header { padding: 15px; background: #2a2a2a; border-bottom: 2px solid #222; display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; font-weight: bold; }
        .menu-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        
        .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 60%; padding: 10px; border-radius: 8px; word-break: break-word; }
        .message.sent { background: #ff6600; align-self: flex-end; }
        .message.received { background: #444; align-self: flex-start; }

        .chat-input-box { padding: 15px; background: #2a2a2a; display: flex; gap: 10px; }
        .chat-input-box input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #1a1a1a; color: #fff; outline: none; }
        .chat-input-box button { padding: 0 20px; background: #ff6600; border: none; color: #fff; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Authentication Screen -->
    <div id="auth-container">
        <div class="auth-box">
            <h2 id="auth-title">Login</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <input type="text" id="pfp" placeholder="Profile Picture URL (Optional)">
            <button onclick="handleAuth()" id="auth-btn">Log In</button>
            <p style="cursor:pointer; font-size:0.9rem; margin-top:15px; color:#aaa;" onclick="toggleAuthMode()">Need an account? Register</p>
        </div>
    </div>

    <!-- Main Application Container -->
    <div id="app-container">
        <!-- Orange Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="user-profile">
                <img id="my-pfp" src="" alt="pfp">
                <span id="my-username">Username</span>
            </div>
            <div class="friends-list" id="friends-list">
                <!-- Friends will populate here -->
                 <div class="friend-item" onclick="selectFriend(1, 'DemoFriend')">Demo Friend (Click to chat)</div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <span id="chat-target-name">Select a friend to chat</span>
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            </div>
            <div class="messages-box" id="messages-box">
                <!-- Messages go here -->
            </div>
            <div class="chat-input-box">
                <input type="text" id="message-input" placeholder="Type a message..." onkeypress="checkEnter(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://chickencoop-chat-server.onrender.com";
        let socket;
        let currentUser = null;
        let currentReceiverId = null;
        let isRegistering = false;

        function toggleAuthMode() {
            isRegistering = !isRegistering;
            document.getElementById('auth-title').innerText = isRegistering ? 'Register' : 'Login';
            document.getElementById('auth-btn').innerText = isRegistering ? 'Sign Up' : 'Log In';
            document.querySelector('.auth-box p').innerText = isRegistering ? 'Already have an account? Login' : 'Need an account? Register';
        }

        async function handleAuth() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const pfp = document.getElementById('pfp').value;
            const endpoint = isRegistering ? '/api/register' : '/api/login';

            const res = await fetch(BACKEND_URL + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, pfp })
            });

            const data = await res.json();
            if (data.error) {
                alert(data.error);
            } else {
                currentUser = data.user || { id: data.userId, username, pfp: pfp || 'https://via.placeholder.com/150' };
                initApp();
            }
        }

        function initApp() {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            
            document.getElementById('my-username').innerText = currentUser.username;
            document.getElementById('my-pfp').src = currentUser.pfp;

            // Connect to Socket.io backend
            socket = io(BACKEND_URL);
            socket.emit('join_room', currentUser.id);

            socket.on('receive_message', (data) => {
                if (data.sender_id === currentReceiverId || data.receiver_id === currentReceiverId) {
                    appendMessage(data.message, data.sender_id === currentUser.id ? 'sent' : 'received');
                }
            });
        }

        function selectFriend(id, name) {
            currentReceiverId = id;
            document.getElementById('chat-target-name').innerText = name;
            document.getElementById('messages-box').innerHTML = ''; // Clear chat view for now
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message || !currentReceiverId) return;

            socket.emit('send_message', {
                sender_id: currentUser.id,
                receiver_id: currentReceiverId,
                message: message
            });

            input.value = '';
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.style.display = sidebar.style.display === 'none' ? 'flex' : 'none';
        }
    </script>
</body>
</html>
