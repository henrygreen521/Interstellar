<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChickenCoop</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border: none; border-radius: 4px; box-sizing: border-box; }
        input { background: #2a2a2a; color: #fff; }
        button { background: #4CAF50; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #45a049; }
        .danger { background: #d9534f; }
        .danger:hover { background: #c9302c; }
        .hidden { display: none !important; }
        .chat-box { height: 300px; overflow-y: scroll; background: #252525; padding: 10px; border-radius: 4px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { background: #333; padding: 8px; border-radius: 4px; display: flex; align-items: center; gap: 10px; }
        .msg img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
        .pfp-placeholder { width: 30px; height: 30px; background: #555; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    </style>
</head>
<body>

<div class="container" id="auth-section">
    <h2>ChickenCoop Login / Register</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <label>Profile Picture (From Device):</label>
    <input type="file" id="pfp-input" accept="image/*">
    <button onclick="handleAuth()">Sign In / Register</button>
</div>

<div class="container hidden" id="app-section">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 id="welcome-msg"></h3>
        <button class="danger" style="width: auto; padding: 5px 10px;" onclick="deleteAccount()">Delete Account</button>
    </div>
    <hr>
    <h4>Start New Chat / Group</h4>
    <input type="text" id="target-user" placeholder="Comma-separated usernames (e.g. user1, user2)">
    <input type="text" id="group-name" placeholder="Optional Group Name">
    <button onclick="createConversation()">Open Chat</button>
    
    <h4>Active Conversations</h4>
    <div id="conv-list"></div>

    <div id="active-chat-pane" class="hidden">
        <h4 id="chat-title"></h4>
        <div class="chat-box" id="msg-box"></div>
        <input type="text" id="msg-input" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
        <button onclick="leaveChat()" style="background: #555;">Back to Conversations</button>
    </div>
</div>

<script>
    const API_BASE = "https://chickencoop-chat-server.onrender.com"; // Replace with your live Render URL
    let currentUser = null;
    let currentConvId = null;

    async function handleAuth() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const pfpFile = document.getElementById('pfp-input').files[0];

        if (!username || !password) return alert("Fill in username and password.");

        const formData = new FormData();
        formData.append('username', username);
        formData.append('password', password);
        if (pfpFile) formData.append('pfp', pfpFile);

        try {
            const res = await fetch(`${API_BASE}/api/auth`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            
            if (data.success) {
                currentUser = data.user;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('welcome-msg').innerText = `Logged in as: ${currentUser.username} [${currentUser.badge_status}]`;
                loadConversations();
            } else {
                alert(data.error);
            }
        } catch (err) {
            alert("Failed to connect to backend server.");
        }
    }

    async function deleteAccount() {
        if (!confirm("Are you sure you want to completely delete your account?")) return;
        const password = prompt("Enter your password to confirm deletion:");
        if (!password) return;

        try {
            const res = await fetch(`${API_BASE}/api/users/${currentUser.username}`, {
                method: 'DELETE',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': currentUser.session_token
                },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            if (data.success) {
                alert("Account deleted successfully.");
                location.reload();
            } else {
                alert(data.error);
            }
        } catch (err) {
            alert("Error deleting account.");
        }
    }

    async function createConversation() {
        const targetInput = document.getElementById('target-user').value.trim();
        const groupNameInput = document.getElementById('group-name').value.trim();
        if (!targetInput) return alert("Enter member usernames.");

        let members = targetInput.split(',').map(u => u.trim()).filter(u => u.length > 0);
        const isGroup = members.length > 1 || groupNameInput.length > 0;

        try {
            const res = await fetch(`${API_BASE}/api/conversations`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': currentUser.session_token
                },
                body: JSON.stringify({ members, group_name: groupNameInput || null, is_group: isGroup })
            });
            const data = await res.json();
            if (data.conversation_id) {
                openChat(data.conversation_id, data.group_name);
                loadConversations();
            } else {
                alert(data.error);
            }
        } catch (err) {
            console.error("Conversation error:", err);
        }
    }

    async function loadConversations() {
        try {
            const res = await fetch(`${API_BASE}/api/conversations`, {
                headers: { 'Authorization': currentUser.session_token }
            });
            const convs = await res.json();
            const listDiv = document.getElementById('conv-list');
            listDiv.innerHTML = "";
            convs.forEach(c => {
                const btn = document.createElement('button');
                btn.innerText = c.group_name || `Chat #${c.id}`;
                btn.style.background = "#333";
                btn.onclick = () => openChat(c.id, c.group_name);
                listDiv.appendChild(btn);
            });
        } catch (err) {
            console.error("Load convs error:", err);
        }
    }

    async function openChat(id, title) {
        currentConvId = id;
        document.getElementById('chat-title').innerText = title;
        document.getElementById('active-chat-pane').classList.remove('hidden');
        loadMessages();
    }

    async function loadMessages() {
        if (!currentConvId) return;
        try {
            const res = await fetch(`${API_BASE}/api/conversations/${currentConvId}/messages`, {
                headers: { 'Authorization': currentUser.session_token }
            });
            if (!res.ok) return;
            const msgs = await res.json();
            const box = document.getElementById('msg-box');
            box.innerHTML = "";
            msgs.forEach(m => {
                const div = document.createElement('div');
                div.className = 'msg';
                const pfpElem = m.pfp_url ? `<img src="${m.pfp_url}" alt="pfp">` : `<div class="pfp-placeholder">${m.username.charAt(0).toUpperCase()}</div>`;
                div.innerHTML = `${pfpElem} <div><strong>${m.username}</strong> <span style="font-size:10px; color:#aaa;">[${m.badge_status || 'Member'}]</span>: ${m.message}</div>`;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        } catch (err) {
            console.error("Load messages error:", err);
        }
    }

    async function sendMessage() {
        const input = document.getElementById('msg-input');
        const message = input.value.trim();
        if (!message || !currentConvId) return;

        try {
            await fetch(`${API_BASE}/api/conversations/${currentConvId}/messages`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': currentUser.session_token
                },
                body: JSON.stringify({ message })
            });
            input.value = "";
            loadMessages();
        } catch (err) {
            console.error("Send message error:", err);
        }
    }

    function leaveChat() {
        currentConvId = null;
        document.getElementById('active-chat-pane').classList.add('hidden');
    }

    setInterval(() => {
        if (currentConvId) loadMessages();
    }, 3000);
</script>

</body>
</html>
