<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChickenCoop Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: sans-serif; 
      background: #111; 
      color: #fff; 
      height: 100vh; 
      margin: 0; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }

    /* Auth Screen */
    #auth-container {
      background: #1a1a1a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 14px;
      width: 320px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #auth-container h2 { color: #ff5722; margin-top: 0; }
    #auth-container input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #222;
      color: #fff;
    }
    #auth-container button {
      width: 100%;
      padding: 12px;
      background: #ff5722;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }
    .error-msg { color: #ff4444; font-size: 13px; margin-bottom: 10px; }

    /* Chat App Layout */
    #app-container {
      display: none;
      width: 95vw;
      max-width: 1200px;
      height: 90vh;
      background: #eee;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      color: #333;
    }
    .layout { display: flex; height: 100%; position: relative; }
    
    /* Left Sidebar (Orange) */
    .sidebar {
      width: 260px;
      background: #ff5722;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 20px;
      font-weight: bold;
      font-size: 18px;
      border-bottom: 2px solid rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-list { flex: 1; overflow-y: auto; padding: 10px; }
    
    .user-item {
      padding: 15px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 5px;
      font-weight: 500;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .user-item:hover, .user-item.active { 
      background: rgba(0, 0, 0, 0.15);
    }

    /* Main Chat Panel */
    .chat-panel { flex: 1; display: flex; flex-direction: column; background: #e0e0e0; position: relative; }
    
    .chat-header {
      padding: 15px 25px;
      background: #f5f5f5;
      border-bottom: 1px solid #ccc;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .menu-icon { font-size: 24px; cursor: pointer; color: #555; }

    #chat-box { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    
    .message { max-width: 70%; padding: 12px 18px; border-radius: 8px; line-height: 1.5; font-size: 15px; }
    .message.incoming { background: #fff; align-self: flex-start; border: 1px solid #d0d0d0; }
    .message.outgoing { background: #ff5722; color: #fff; align-self: flex-end; }
    
    #form { padding: 15px 25px; background: #f5f5f5; display: flex; gap: 15px; border-top: 1px solid #ccc; }
    #message-input {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #aaa;
      background: #fff;
      font-size: 15px;
    }
    #form button {
      padding: 0 25px;
      background: #ff5722;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    #form button:disabled { background: #aaa; cursor: not-allowed; }

    /* Foldout Menu Modal/Drawer as requested in sketch */
    #foldout-menu {
      display: none;
      position: absolute;
      top: 60px;
      right: 20px;
      width: 280px;
      background: #fff;
      border: 1px solid #ccc;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      border-radius: 8px;
      z-index: 100;
      padding: 15px;
      color: #333;
    }
    #foldout-menu h3 { margin-top: 0; font-size: 16px; color: #ff5722; }
    #foldout-menu input { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; }
    #foldout-menu button { width: 100%; padding: 8px; background: #ff5722; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-container">
    <h2>ChickenCoop Login</h2>
    <div id="error-msg" class="error-msg"></div>
    <input type="text" id="auth-username" placeholder="Username" maxlength="15" required />
    <input type="password" id="auth-password" placeholder="Password" required />
    <button onclick="handleAuth('login')">Log In</button>
    <button onclick="handleAuth('register')" style="background: #333; margin-top: 8px;">Sign Up</button>
  </div>

  <!-- App Screen -->
  <div id="app-container">
    <div class="layout">
      
      <!-- Left Sidebar (Orange) -->
      <div class="sidebar">
        <div class="sidebar-header">
          <span id="current-user-display"></span>
          <!-- Back arrow logs out / goes back to login -->
          <span style="cursor: pointer;" title="Log out" onclick="logout()">←</span>
        </div>
        <div style="padding: 10px 15px; font-size: 12px; font-weight: bold; opacity: 0.8;">ONLINE USERS</div>
        <div id="user-list" class="user-list"></div>
      </div>

      <!-- Main Chat Area -->
      <div class="chat-panel">
        <div class="chat-header">
          <span id="chat-with-display">Select a friend</span>
          <!-- Triple-line menu icon opens the foldout menu -->
          <div class="menu-icon" title="Menu" onclick="toggleMenu()">☰</div>
        </div>
        
        <!-- Foldout Menu Drawer -->
        <div id="foldout-menu">
          <h3>Friends & Requests</h3>
          <div style="font-size: 13px; color: #666; margin-bottom: 10px;">Add friends by username:</div>
          <input type="text" id="add-friend-input" placeholder="Enter username..." />
          <button onclick="alert('Friend request system linking up next!')">Send Friend Request</button>
        </div>

        <div id="chat-box">
          <div style="text-align: center; color: #888; margin-top: 50px;">
            Click an online user on the orange sidebar to start chatting!
          </div>
        </div>

        <form id="form" onsubmit="sendMessage(event)">
          <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" disabled />
          <button type="submit" id="send-btn" disabled>Send</button>
        </form>
      </div>

    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const BACKEND_URL = 'https://chickencoop-chat-server.onrender.com';
    
    let socket;
    let currentUser = null;
    let activeChatUser = null;

    async function handleAuth(type) {
      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const errorDiv = document.getElementById('error-msg');
      errorDiv.textContent = '';

      if (!username || !password) {
        errorDiv.textContent = 'Please fill in all fields.';
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}/api/${type}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          currentUser = data.username;
          initChatApp();
        } else {
          errorDiv.textContent = data.error || 'Authentication failed.';
        }
      } catch (e) {
        errorDiv.textContent = 'Could not connect to server.';
      }
    }

    function initChatApp() {
      document.getElementById('auth-container').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';
      document.getElementById('current-user-display').textContent = currentUser;

      socket = io(BACKEND_URL);
      socket.emit('join', currentUser);

      socket.on('online_users', (users) => {
        const userListEl = document.getElementById('user-list');
        userListEl.innerHTML = '';

        users.forEach(user => {
          if (user === currentUser) return; 

          const div = document.createElement('div');
          div.className = `user-item ${activeChatUser === user ? 'active' : ''}`;
          div.textContent = user;
          div.onclick = () => selectUser(user);
          userListEl.appendChild(div);
        });
      });

      socket.on('private_message', ({ sender, text }) => {
        if (activeChatUser === sender) {
          appendMessage(sender, text, 'incoming');
        }
      });
    }

    function selectUser(username) {
      activeChatUser = username;
      document.getElementById('chat-with-display').textContent = `Chat with ${username}`;
      
      const input = document.getElementById('message-input');
      input.disabled = false;
      input.focus();
      document.getElementById('send-btn').disabled = false;
      document.getElementById('chat-box').innerHTML = '';

      // Highlights the chosen user in the orange sidebar
      document.querySelectorAll('.user-item').forEach(el => {
        el.classList.toggle('active', el.textContent === username);
      });
    }

    function toggleMenu() {
      const menu = document.getElementById('foldout-menu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function logout() {
      if (socket) socket.disconnect();
      currentUser = null;
      activeChatUser = null;
      document.getElementById('app-container').style.display = 'none';
      document.getElementById('auth-container').style.display = 'block';
      document.getElementById('auth-password').value = '';
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !activeChatUser) return;

      socket.emit('private_message', {
        sender: currentUser,
        receiver: activeChatUser,
        text: text
      });

      appendMessage('You', text, 'outgoing');
      input.value = '';
    }

    function appendMessage(sender, text, type) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
