<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChickenCoop - Watch</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #ff5722;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-main);
        }

        .nav-link.active svg {
            color: var(--accent-color);
        }

        .container {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            width: 100%;
        }

        .page-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .watch-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .watch-grid {
                grid-template-columns: 1fr;
            }
        }

        .player-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .player-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-info {
            padding: 20px;
        }

        .player-text h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .player-text p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Custom ID Loader & Search Tool Box */
        .panel-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .custom-input {
            flex: 1;
            padding: 10px 14px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
        }

        .custom-input:focus {
            border-color: var(--accent-color);
        }

        .type-select {
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
        }

        .action-btn {
            padding: 10px 20px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        /* Search Results for TMDB Finder */
        .search-results-box {
            display: none;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            background-color: var(--bg-color);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .search-result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background-color: var(--panel-bg);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .result-actions {
            display: flex;
            gap: 6px;
        }

        .small-btn {
            padding: 4px 8px;
            font-size: 0.75rem;
            background: var(--border-color);
            color: var(--text-main);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .small-btn.primary {
            background: var(--accent-color);
        }

        /* TV Show Episode & Season Controls Panel */
        .episodes-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .episodes-controls-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .episode-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .ep-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            min-width: 44px;
            text-align: center;
        }

        .ep-btn:hover, .ep-btn.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* Sidebar Shortcuts Panel */
        .sidebar-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: fit-content;
        }

        .search-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            background-color: var(--bg-color);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .sidebar-heading {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-top: 4px;
        }

        .recommendation-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .rec-item {
            padding: 10px 12px;
            background-color: var(--bg-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .rec-item:hover, .rec-item.active {
            color: var(--text-main);
            border-color: var(--border-color);
            background-color: #252525;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo-area">
            <span>ChickenCoop</span>
        </div>
        <nav class="nav-links">
            <a href="/" class="nav-link">HOME</a>
            <a href="/chat.html" class="nav-link">CHAT</a>
            <a href="/watch.html" class="nav-link active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display: inline-block; vertical-align: -2px; margin-right: 6px;">
                    <path d="M19 4H5C3.89 4 3 4.9 3 6V18C3 19.1 3.89 20 5 20H19C20.11 20 21 19.1 21 18V6C21 4.9 20.11 4 19 4ZM19 18H5V6H19V18Z"/>
                    <rect x="6" y="6" width="2" height="2" rx="0.5"/>
                    <rect x="11" y="6" width="2" height="2" rx="0.5"/>
                    <rect x="16" y="6" width="2" height="2" rx="0.5"/>
                    <rect x="6" y="16" width="2" height="2" rx="0.5"/>
                    <rect x="11" y="16" width="2" height="2" rx="0.5"/>
                    <rect x="16" y="16" width="2" height="2" rx="0.5"/>
                    <polygon points="10,9.5 15,12 10,14.5"/>
                </svg>WATCH
            </a>
        </nav>
    </header>

    <main class="container">
        <h1 class="page-title">Watch</h1>
        
        <div class="watch-grid">
            <div class="player-section">
                <div class="player-card">
                    <div class="iframe-container">
                        <iframe id="media-frame" src="" allowfullscreen></iframe>
                    </div>
                    <div class="player-info">
                        <div class="player-text">
                            <h2 id="media-title">Select or Load Media</h2>
                            <p id="media-desc">Stream anything securely through your proxy tunnel.</p>
                        </div>
                    </div>
                </div>

                <!-- TMDB ID Search & Finder Tool -->
                <div class="panel-box">
                    <div class="sidebar-heading" style="font-size:0.9rem;">Find Movie / Show TMDB ID</div>
                    <div class="input-row">
                        <select id="search-type" class="type-select">
                            <option value="movie">Movie</option>
                            <option value="tv">TV Show</option>
                        </select>
                        <input type="text" id="search-query-input" class="custom-input" placeholder="Search title (e.g. Breaking Bad)...">
                        <button class="action-btn" onclick="searchTMDB()">Search ID</button>
                    </div>
                    <div class="search-results-box" id="search-results-box"></div>
                </div>

                <!-- Custom Direct ID Loader -->
                <div class="panel-box">
                    <div class="sidebar-heading" style="font-size:0.9rem;">Direct ID Loader</div>
                    <div class="input-row">
                        <select id="custom-type" class="type-select">
                            <option value="movie">Movie</option>
                            <option value="tv">TV Show</option>
                        </select>
                        <input type="text" id="custom-id-input" class="custom-input" placeholder="Enter TMDB ID...">
                        <button class="action-btn" onclick="loadCustomMedia()">Load</button>
                    </div>
                </div>

                <!-- TV Show Season & Episode Panel -->
                <div class="episodes-panel" id="episodes-panel">
                    <div class="episodes-controls-top">
                        <span class="sidebar-heading" id="show-season-title" style="margin:0;">Episodes</span>
                        <select id="season-select" class="type-select" onchange="changeSeason()" style="padding: 6px 10px; font-size: 0.85rem;">
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                    <div class="episode-buttons" id="episode-buttons-container"></div>
                </div>
            </div>

            <!-- Sidebar Quick Shortcuts -->
            <div class="sidebar-panel">
                <div class="search-hint">💡 Tip: Press <b>Ctrl + F</b> to search shortcuts</div>
                <div class="sidebar-heading">Quick Shortcuts</div>
                <div class="recommendation-list" id="results-list"></div>
            </div>
        </div>
    </main>

    <script>
        const mediaLibrary = [
            { type: 'movie', id: '550', title: 'Fight Club', desc: 'A depressed man suffering from insomnia meets a strange soap salesman.' },
            { type: 'movie', id: '299536', title: 'Avengers: Infinity War', desc: 'The Avengers and their allies must be willing to sacrifice all in an attempt to defeat the powerful Thanos.' },
            { type: 'movie', id: '157336', title: 'Interstellar', desc: 'Interstellar chronicles the adventures of a group of explorers who make use of a newly discovered wormhole.' },
            { type: 'tv', id: '1399', title: 'Game of Thrones', desc: 'Nine noble families fight for control over the lands of Westeros.', seasons: 8, episodesPerSeason: [10,10,10,10,10,7,6,6] },
            { type: 'tv', id: '66732', title: 'Stranger Things', desc: 'When a young boy vanishes, a small town uncovers a mystery involving secret experiments.', seasons: 4, episodesPerSeason: [8,9,8,9] },
            { type: 'tv', id: '1396', title: 'Breaking Bad', desc: 'A chemistry teacher diagnosed with inoperable lung cancer turns to manufacturing and selling methamphetamine.', seasons: 5, episodesPerSeason: [7,13,13,13,16] }
        ];

        const resultsList = document.getElementById('results-list');
        const frame = document.getElementById('media-frame');
        const mediaTitle = document.getElementById('media-title');
        const mediaDesc = document.getElementById('media-desc');
        const episodesPanel = document.getElementById('episodes-panel');
        const episodeButtonsContainer = document.getElementById('episode-buttons-container');
        const showSeasonTitle = document.getElementById('show-season-title');
        const seasonSelect = document.getElementById('season-select');
        const searchResultsBox = document.getElementById('search-results-box');

        let currentActiveShow = null;

        function getProxyUrl(rawUrl) {
            try {
                if (typeof __uv$config !== 'undefined' && typeof __uv$config.encodeUrl === 'function' && typeof __uv$config.prefix === 'string') {
                    return __uv$config.prefix + __uv$config.encodeUrl(rawUrl);
                }
            } catch (e) {}
            return rawUrl;
        }

        // Search TMDB API securely through proxy for IDs and Copy button
        async function searchTMDB() {
            const type = document.getElementById('search-type').value;
            const query = document.getElementById('search-query-input').value.trim();
            if (!query) return;

            searchResultsBox.style.display = 'flex';
            searchResultsBox.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem; padding:4px;">Searching...</div>';

            try {
                const tmdbUrl = `https://api.themoviedb.org/3/search/${type}?api_key=2df4484ea0cd1a977536d75d33f7c460&query=${encodeURIComponent(query)}`;
                const proxyFetchUrl = getProxyUrl(tmdbUrl);
                
                const res = await fetch(proxyFetchUrl);
                const data = await res.json();

                if (!data.results || data.results.length === 0) {
                    searchResultsBox.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem; padding:4px;">No results found. Try direct ID loader.</div>';
                    return;
                }

                searchResultsBox.innerHTML = '';
                data.results.slice(0, 5).forEach(item => {
                    const titleName = item.title || item.name;
                    const dateYear = (item.release_date || item.first_air_date || '').substring(0, 4);
                    
                    const div = document.createElement('div');
                    div.className = 'search-result-item';
                    div.innerHTML = `
                        <span><b>${titleName}</b> (${dateYear}) [ID: ${item.id}]</span>
                        <div class="result-actions">
                            <button class="small-btn" onclick="navigator.clipboard.writeText('${item.id}'); alert('Copied ID: ${item.id}');">Copy ID</button>
                            <button class="small-btn primary" onclick="loadFromSearch('${type}', '${item.id}', '${titleName.replace(/'/g, "\\'")}', '${(item.overview || '').replace(/'/g, "\\'")}')">Watch</button>
                        </div>
                    `;
                    searchResultsBox.appendChild(div);
                });
            } catch (err) {
                searchResultsBox.innerHTML = '<div style="color:#ff5722; font-size:0.85rem; padding:4px;">Search error or proxy restriction. Use Direct ID loader.</div>';
            }
        }

        function loadFromSearch(type, id, title, overview) {
            const item = { type, id, title, desc: overview, seasons: 5, episodesPerSeason: [12,12,12,12,12] };
            loadMedia(item);
        }

        function loadMedia(item) {
            mediaTitle.innerText = item.title;
            mediaDesc.innerText = item.desc || 'No description available.';

            let targetUrl = '';
            if (item.type === 'tv') {
                currentActiveShow = item;
                targetUrl = `https://player.videasy.net/tv/${item.id}/1/1`;
                setupSeasonsAndEpisodes(item, 1);
                episodesPanel.style.display = 'flex';
            } else {
                currentActiveShow = null;
                targetUrl = `https://player.videasy.net/movie/${item.id}`;
                episodesPanel.style.display = 'none';
            }

            frame.src = getProxyUrl(targetUrl);
        }

        function loadCustomMedia() {
            const type = document.getElementById('custom-type').value;
            const id = document.getElementById('custom-id-input').value.trim();
            if (!id) return;

            const item = { type, id, title: `Custom ${type.toUpperCase()} (${id})`, desc: 'Manually loaded media stream.', seasons: 5, episodesPerSeason: [12,12,12,12,12] };
            loadMedia(item);
        }

        function setupSeasonsAndEpisodes(show, selectedSeasonNum) {
            seasonSelect.innerHTML = '';
            const totalSeasons = show.seasons || 5;
            
            for (let s = 1; s <= totalSeasons; s++) {
                const opt = document.createElement('option');
                opt.value = s;
                opt.innerText = `Season ${s}`;
                if (s === selectedSeasonNum) opt.selected = true;
                seasonSelect.appendChild(opt);
            }

            renderEpisodesForSeason(show, selectedSeasonNum);
        }

        function changeSeason() {
            if (!currentActiveShow) return;
            const selectedSeason = parseInt(seasonSelect.value);
            renderEpisodesForSeason(currentActiveShow, selectedSeason);
        }

        function renderEpisodesForSeason(show, seasonNum) {
            episodeButtonsContainer.innerHTML = '';
            showSeasonTitle.innerText = `${show.title} - Season ${seasonNum}`;

            // Determine episode count safely
            let epCount = 12;
            if (show.episodesPerSeason) {
                if (Array.isArray(show.episodesPerSeason)) {
                    epCount = show.episodesPerSeason[seasonNum - 1] || 12;
                } else {
                    epCount = show.episodesPerSeason;
                }
            }

            for (let ep = 1; ep <= epCount; ep++) {
                const btn = document.createElement('button');
                btn.className = `ep-btn ${ep === 1 ? 'active' : ''}`;
                btn.innerText = ep;
                btn.onclick = () => {
                    const targetUrl = `https://player.videasy.net/tv/${show.id}/${seasonNum}/${ep}`;
                    frame.src = getProxyUrl(targetUrl);
                    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                episodeButtonsContainer.appendChild(btn);
            }

            // Load episode 1 of the selected season automatically
            const targetUrl = `https://player.videasy.net/tv/${show.id}/${seasonNum}/1`;
            frame.src = getProxyUrl(targetUrl);
        }

        function renderLibrary() {
            resultsList.innerHTML = '';
            mediaLibrary.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'rec-item';
                div.innerText = item.title;
                div.onclick = () => loadMedia(item);
                resultsList.appendChild(div);
            });
        }

        // Initialize default view
        renderLibrary();
        loadMedia(mediaLibrary[0]);
    </script>
</body>
</html>
