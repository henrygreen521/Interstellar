<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChickenCoop - Watch</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #ff5722;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Style matching your app */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-main);
        }

        .nav-link.active svg {
            color: var(--accent-color);
        }

        /* Main Watch Container Layout */
        .container {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            width: 100%;
        }

        .page-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .watch-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .watch-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Video Player Card */
        .player-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-info {
            padding: 20px;
        }

        .player-info h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .player-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Sidebar Panel */
        .sidebar-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: fit-content;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        .sidebar-heading {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .recommendation-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 450px;
            overflow-y: auto;
        }

        .rec-item {
            padding: 10px 12px;
            background-color: var(--bg-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .rec-item:hover {
            color: var(--text-main);
            border-color: var(--border-color);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo-area">
            <span>ChickenCoop</span>
        </div>
        <nav class="nav-links">
            <a href="/" class="nav-link">HOME</a>
            <a href="/chat.html" class="nav-link">CHAT</a>
            <a href="/watch.html" class="nav-link active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display: inline-block; vertical-align: -2px; margin-right: 6px;">
                    <path d="M19 4H5C3.89 4 3 4.9 3 6V18C3 19.1 3.89 20 5 20H19C20.11 20 21 19.1 21 18V6C21 4.9 20.11 4 19 4ZM19 18H5V6H19V18Z"/>
                    <rect x="6" y="6" width="2" height="2" rx="0.5"/>
                    <rect x="11" y="6" width="2" height="2" rx="0.5"/>
                    <rect x="16" y="6" width="2" height="2" rx="0.5"/>
                    <rect x="6" y="16" width="2" height="2" rx="0.5"/>
                    <rect x="11" y="16" width="2" height="2" rx="0.5"/>
                    <rect x="16" y="16" width="2" height="2" rx="0.5"/>
                    <polygon points="10,9.5 15,12 10,14.5"/>
                </svg>WATCH
            </a>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="container">
        <h1 class="page-title">Watch</h1>
        
        <div class="watch-grid">
            <!-- Video Player Column -->
            <div class="player-card">
                <div class="iframe-container">
                    <iframe id="media-frame" src="https://player.videasy.net/movie/550" allowfullscreen></iframe>
                </div>
                <div class="player-info">
                    <h2 id="media-title">Fight Club</h2>
                    <p id="media-desc">A depressed man suffering from insomnia meets a strange soap salesman.</p>
                </div>
            </div>

            <!-- Sidebar Column -->
            <div class="sidebar-panel">
                <input type="text" class="search-input" placeholder="Search Shows & Movies..." id="media-search">
                <div class="sidebar-heading">Related Media</div>
                <div class="recommendation-list">
                    <div class="rec-item" onclick="loadMedia('movie', '550', 'Fight Club', 'A depressed man suffering from insomnia meets a strange soap salesman.')">Fight Club</div>
                    <div class="rec-item" onclick="loadMedia('movie', '299536', 'Avengers: Infinity War', 'The Avengers and their allies must be willing to sacrifice all in an attempt to defeat the powerful Thanos.')">Avengers: Infinity War</div>
                    <div class="rec-item" onclick="loadMedia('movie', '157336', 'Interstellar', 'Interstellar chronicles the adventures of a group of explorers who make use of a newly discovered wormhole.')">Interstellar</div>
                    <div class="rec-item" onclick="loadMedia('tv', '1399/1/1', 'Game of Thrones (S1 E1)', 'Nine noble families fight for control over the lands of Westeros.')">Game of Thrones</div>
                    <div class="rec-item" onclick="loadMedia('tv', '66732/1/1', 'Stranger Things (S1 E1)', 'When a young boy vanishes, a small town uncovers a mystery involving secret experiments.')">Stranger Things</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Simple function to swap out the Videasy iframe source dynamically on click
        function loadMedia(type, id, title, desc) {
            const frame = document.getElementById('media-frame');
            frame.src = `https://player.videasy.net/${type}/${id}`;
            document.getElementById('media-title').innerText = title;
            document.getElementById('media-desc').innerText = desc;
        }

        // Flexible, less-specific search filter
        const searchInput = document.getElementById('media-search');
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const terms = query.split(/\s+/);
            const items = document.querySelectorAll('.rec-item');

            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                const matches = query === '' || terms.every(term => text.includes(term));
                item.style.display = matches ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
