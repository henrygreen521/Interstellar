<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChickenCoop - Watch</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #ff5722;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-main);
        }

        .nav-link.active svg {
            color: var(--accent-color);
        }

        .container {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            width: 100%;
        }

        .page-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .watch-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .watch-grid {
                grid-template-columns: 1fr;
            }
        }

        .player-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .player-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-info {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .player-text h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .player-text p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Episode Controls Panel for TV Shows */
        .episodes-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: none; /* Hidden by default, shown for TV shows */
            flex-direction: column;
            gap: 12px;
        }

        .episodes-header {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .episode-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .ep-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .ep-btn:hover, .ep-btn.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* Sidebar Panel */
        .sidebar-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: fit-content;
        }

        .search-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            background-color: var(--bg-color);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .sidebar-heading {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-top: 4px;
        }

        .recommendation-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 500px;
            overflow-y: auto;
        }

        .rec-item {
            padding: 10px 12px;
            background-color: var(--bg-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .rec-item:hover, .rec-item.active {
            color: var(--text-main);
            border-color: var(--border-color);
            background-color: #252525;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo-area">
            <span>ChickenCoop</span>
        </div>
        <nav class="nav-links">
            <a href="/" class="nav-link">HOME</a>
            <a href="/chat.html" class="nav-link">CHAT</a>
            <a href="/watch.html" class="nav-link active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display: inline-block; vertical-align: -2px; margin-right: 6px;">
                    <path d="M19 4H5C3.89 4 3 4.9 3 6V18C3 19.1 3.89 20 5 20H19C20.11 20 21 19.1 21 18V6C21 4.9 20.11 4 19 4ZM19 18H5V6H19V18Z"/>
                    <rect x="6" y="6" width="2" height="2" rx="0.5"/>
                    <rect x="11" y="6" width="2" height="2" rx="0.5"/>
                    <rect x="16" y="6" width="2" height="2" rx="0.5"/>
                    <rect x="6" y="16" width="2" height="2" rx="0.5"/>
                    <rect x="11" y="16" width="2" height="2" rx="0.5"/>
                    <rect x="16" y="16" width="2" height="2" rx="0.5"/>
                    <polygon points="10,9.5 15,12 10,14.5"/>
                </svg>WATCH
            </a>
        </nav>
    </header>

    <main class="container">
        <h1 class="page-title">Watch</h1>
        
        <div class="watch-grid">
            <!-- Player and Show Controls Section -->
            <div class="player-section">
                <div class="player-card">
                    <div class="iframe-container">
                        <iframe id="media-frame" src="https://player.videasy.net/movie/550" allowfullscreen></iframe>
                    </div>
                    <div class="player-info">
                        <div class="player-text">
                            <h2 id="media-title">Fight Club</h2>
                            <p id="media-desc">A depressed man suffering from insomnia meets a strange soap salesman.</p>
                        </div>
                    </div>
                </div>

                <!-- TV Show Episode Selector (Appears for TV series) -->
                <div class="episodes-panel" id="episodes-panel">
                    <div class="episodes-header">
                        <span id="show-season-title">Season 1 Episodes</span>
                    </div>
                    <div class="episode-buttons" id="episode-buttons-container">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>

            <!-- Sidebar Library -->
            <div class="sidebar-panel">
                <div class="search-hint">💡 Tip: Press <b>Ctrl + F</b> to search library</div>
                <div class="sidebar-heading">Media Library</div>
                <div class="recommendation-list" id="results-list"></div>
            </div>
        </div>
    </main>

    <script>
        const mediaLibrary = [
            { type: 'movie', id: '550', title: 'Fight Club', desc: 'A depressed man suffering from insomnia meets a strange soap salesman.' },
            { type: 'movie', id: '299536', title: 'Avengers: Infinity War', desc: 'The Avengers and their allies must be willing to sacrifice all in an attempt to defeat the powerful Thanos.' },
            { type: 'movie', id: '157336', title: 'Interstellar', desc: 'Interstellar chronicles the adventures of a group of explorers who make use of a newly discovered wormhole.' },
            { type: 'tv', id: '1399', title: 'Game of Thrones', desc: 'Nine noble families fight for control over the lands of Westeros.', seasons: 8, episodesPerSeason: 10 },
            { type: 'tv', id: '66732', title: 'Stranger Things', desc: 'When a young boy vanishes, a small town uncovers a mystery involving secret experiments.', seasons: 4, episodesPerSeason: 8 },
            { type: 'movie', id: '27205', title: 'Inception', desc: 'A thief who steals corporate secrets through the use of dream-sharing technology.' },
            { type: 'movie', id: '155', title: 'The Dark Knight', desc: 'Batman raises the stakes in his war on crime with the help of Lt. Jim Gordon and District Attorney Harvey Dent.' },
            { type: 'movie', id: '680', title: 'Pulp Fiction', desc: 'The lives of two mob hitmen, a boxer, a gangster and his wife intertwine in four tales of violence and redemption.' },
            { type: 'tv', id: '1396', title: 'Breaking Bad', desc: 'A chemistry teacher diagnosed with inoperable lung cancer turns to manufacturing and selling methamphetamine.', seasons: 5, episodesPerSeason: 10 },
            { type: 'tv', id: '85552', title: 'Euphoria', desc: 'A look at life through a group of high school students as they grapple with issues of drugs, sex, and identity.', seasons: 2, episodesPerSeason: 8 }
        ];

        const resultsList = document.getElementById('results-list');
        const frame = document.getElementById('media-frame');
        const mediaTitle = document.getElementById('media-title');
        const mediaDesc = document.getElementById('media-desc');
        const episodesPanel = document.getElementById('episodes-panel');
        const episodeButtonsContainer = document.getElementById('episode-buttons-container');
        const showSeasonTitle = document.getElementById('show-season-title');

        function loadMedia(item) {
            mediaTitle.innerText = item.title;
            mediaDesc.innerText = item.desc;

            if (item.type === 'tv') {
                // Default to Season 1, Episode 1 for TV shows
                frame.src = `https://player.videasy.net/tv/${item.id}/1/1`;
                renderEpisodes(item, 1);
                episodesPanel.style.display = 'flex';
            } else {
                frame.src = `https://player.videasy.net/movie/${item.id}`;
                episodesPanel.style.display = 'none';
            }

            // Highlight active item in sidebar
            document.querySelectorAll('.rec-item').forEach(el => el.classList.remove('active'));
            event && event.currentTarget && event.currentTarget.classList.add('active');
        }

        function renderEpisodes(show, seasonNum) {
            episodeButtonsContainer.innerHTML = '';
            showSeasonTitle.innerText = `${show.title} - Season ${seasonNum} Episodes`;

            const totalEp = show.episodesPerSeason || 8;
            for (let ep = 1; ep <= totalEp; ep++) {
                const btn = document.createElement('button');
                btn.className = `ep-btn ${ep === 1 ? 'active' : ''}`;
                btn.innerText = `Ep ${ep}`;
                btn.onclick = () => {
                    frame.src = `https://player.videasy.net/tv/${show.id}/${seasonNum}/${ep}`;
                    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                episodeButtonsContainer.appendChild(btn);
            }
        }

        function renderLibrary() {
            resultsList.innerHTML = '';
            mediaLibrary.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `rec-item ${index === 0 ? 'active' : ''}`;
                div.innerText = item.title;
                div.onclick = (e) => loadMedia(item);
                resultsList.appendChild(div);
            });
        }

        // Initialize library list
        renderLibrary();
    </script>
</body>
</html>
