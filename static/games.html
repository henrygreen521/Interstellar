<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" id="tab-favicon" href="/favicon.png" />
  <title id="t">Games - Chicken Coop</title>
  
  <link rel="stylesheet" href="/assets/css/global.css?v=6" />
  <link rel="stylesheet" href="/assets/css/error.css?v=2" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=01" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background-color: #0b0b0b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Pinned Navbar */
    .f-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* --- Search & Category Filters --- */
    .input-c {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 10px auto 10px auto !important;
      max-width: 600px;
      padding: 0 20px;
    }

    .input-c input, .input-c select {
      background: linear-gradient(
        135deg, 
        rgba(255, 255, 255, 0.12) 0%, 
        rgba(255, 255, 255, 0.03) 50%, 
        rgba(255, 255, 255, 0.06) 100%
      ), rgba(20, 20, 20, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 18px;
      border-radius: 16px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-c input { flex: 1; }

    .input-c input:focus, .input-c select:focus {
      border-color: #ff5722;
      box-shadow: 0 0 15px rgba(255, 87, 34, 0.3);
    }

    .input-c select option { background-color: #1a1a1a; color: #fff; }

    /* --- Games Grid Styling --- */
    .games-main-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 20px 20px;
      min-height: 400px;
    }

    .apps {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .game-card {
      width: 180px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%), rgba(20, 20, 20, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .game-card:hover {
      transform: translateY(-6px);
      border-color: #ff5722;
      box-shadow: 0 15px 35px rgba(255, 87, 34, 0.3);
    }

    .game-card img {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 12px;
      margin-bottom: 12px;
      object-fit: cover;
      background: rgba(0,0,0,0.5);
    }

    .game-card h3 {
      font-size: 15px;
      margin: 0;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- Cinematic In-Page Player Modal --- */
    #game-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #game-modal.active { display: flex; }

    .modal-controls {
      width: 90%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-controls h2 { margin: 0; color: #fff; font-size: 22px; }

    .modal-controls button {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 24px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: bold;
      margin-left: 10px;
    }

    .modal-iframe-container {
      width: 90%;
      max-width: 1200px;
      height: 80vh;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
      background: #000;
    }

    .modal-iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <!-- Navbar Target -->
  <div class="f-nav"></div>

  <!-- Search & Category Filters -->
  <div class="input-c">
    <input type="text" id="search" onkeyup="filterGames()" placeholder="Search library..." />
    <select id="category" name="category" onchange="filterGames()">
      <option value="all">All Games</option>
      <option value="flash">Classics / Flash</option>
      <option value="math">Trending</option>
      <option value="2P">Multiplayer</option>
      <option value="sports">Sports</option>
    </select>
  </div>

  <!-- Games Grid Container -->
  <div class="games-main-wrapper">
    <div class="apps" id="apps-container"></div>
  </div>

  <!-- Cinematic Game Player Modal -->
  <div id="game-modal">
    <div class="modal-controls">
      <h2 id="modal-title">Game Title</h2>
      <div>
        <button onclick="toggleFullscreen()">Fullscreen</button>
        <button onclick="closeGame()" style="background: rgba(255, 59, 48, 0.2); border-color: #ff3b30; color: #ff3b30;">Close</button>
      </div>
    </div>
    <div class="modal-iframe-container">
      <iframe id="game-frame" src="" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Game Grid & Modal Logic Script -->
  <script>
    const gnGamesList = [
      { title: "The Binding of Isaac", slug: "binding-of-isaac", category: "flash" },
      { title: "Baldi's Basics", slug: "baldis-basics", category: "flash" },
      { title: "Game 1", slug: "insert-game-folder-name", category: "math" },
      { title: "Game 2", slug: "insert-game-folder-name", category: "math" },
      { title: "Game 3", slug: "insert-game-folder-name", category: "math" },
      { title: "Game 4", slug: "insert-game-folder-name", category: "math" },
      { title: "Game 5", slug: "insert-game-folder-name", category: "math" },
      { title: "Game 6", slug: "insert-game-folder-name", category: "math" },
      { title: "Game 7", slug: "insert-game-folder-name", category: "math" },
      { title: "Game 8", slug: "insert-game-folder-name", category: "math" },
      { title: "Game 9", slug: "insert-game-folder-name", category: "math" }
    ];

    function renderGrid(filterCat = "all", searchQuery = "") {
      const appsContainer = document.getElementById('apps-container');
      if (!appsContainer) return;
      appsContainer.innerHTML = "";
      
      gnGamesList.forEach(game => {
        if (game.slug === "insert-game-folder-name") return;

        const matchesSearch = game.title.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesCat = filterCat === "all" || game.category === filterCat;
        
        if (matchesSearch && matchesCat) {
          const card = document.createElement('div');
          card.className = 'game-card';
          const imgUrl = `/games/${game.slug}/thumbnail.png`; 
          
          card.innerHTML = `
            <img src="${imgUrl}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/150/1a1a1a/ff5722?text=Game'">
            <h3>${game.title}</h3>
          `;
          card.onclick = () => openGame(game.slug, game.title);
          appsContainer.appendChild(card);
        }
      });
    }

    window.filterGames = function() {
      const q = document.getElementById('search').value;
      const cat = document.getElementById('category').value;
      renderGrid(cat, q);
    };

    window.openGame = function(slug, title) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('game-frame').src = `/games/${slug}/index.html`;
      document.getElementById('game-modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    };

    window.closeGame = function() {
      document.getElementById('game-modal').classList.remove('active');
      document.getElementById('game-frame').src = "";
      document.body.style.overflow = 'auto';
    };

    window.toggleFullscreen = function() {
      const iframe = document.getElementById('game-frame');
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      renderGrid();
    });
  </script>

  <!-- Navbar & Utility Script Stack -->
  <script src="/assets/js/mg-pxy.js"></script>
  <script src="/assets/js/index-3.js"></script>
  <script src="/assets/mathematics/bundle.js?v=2025-04-15"></script>
  <script src="/assets/mathematics/config.js?v=2025-04-15"></script>
  <script src="/assets/js/m1.js"></script>

  <!-- Force-Snap Layout Lock: Eliminates any injected script spacers below the navbar -->
  <script>
    window.addEventListener('load', () => {
      const nav = document.querySelector('.f-nav');
      const inputC = document.querySelector('.input-c');
      if (nav && inputC && nav.nextElementSibling !== inputC) {
        // If a script injected something between the nav and search, force move it right under nav!
        nav.parentNode.insertBefore(inputC, nav.nextSibling);
      }

      // Ensure the games grid is visible at the top of the viewport (under the nav) on load.
      // Some injected scripts can push content down; this recenters the view onto the games area.
      const apps = document.getElementById('apps-container');
      if (apps) {
        const navHeight = nav ? nav.offsetHeight : 0;
        const appsTop = apps.getBoundingClientRect().top + window.scrollY;
        const target = Math.max(0, appsTop - navHeight - 8);
        window.scrollTo({ top: target, behavior: 'smooth' });
      }
    });
  </script>
</body>

</html>
