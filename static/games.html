<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" id="tab-favicon" href="/favicon.png" />
  <title id="t">Games - Chicken Coop</title>
  
  <link rel="stylesheet" href="/assets/css/global.css?v=6" />
  <link rel="stylesheet" href="/assets/css/error.css?v=2" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=01" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background-color: #0b0b0b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Fixed Left Sidebar Navbar */
    .f-nav {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 1000;
    }

    /* Main Content Area - Pushed right past the sidebar */
    .main-content {
      margin-left: 260px;
      padding: 20px;
      min-height: 100vh;
      box-sizing: border-box;
      top: 0;
    }

    /* --- Library Choice Landing View --- */
    #selection-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
    }

    #selection-view.hidden {
      display: none;
    }

    #selection-view h1 {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.5px;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #fff 0%, #aaa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .choice-container {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Liquid Glass Choice Cards */
    .choice-card {
      width: 220px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%), rgba(20, 20, 20, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 30px 20px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .choice-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 10px 30px rgba(180, 180, 180, 0.15), inset 0 0 15px rgba(255, 255, 255, 0.05);
    }

    .choice-card h3 {
      margin: 18px 0 6px 0;
      font-size: 16px;
      font-weight: 500;
      color: #fff;
    }

    .choice-card p {
      margin: 0;
      font-size: 12px;
      color: #888;
    }

    /* --- CSS Art: Gray World Wide Web Globe --- */
    .art-globe {
      width: 56px;
      height: 56px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .art-globe::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: scale(0.7);
    }
    .art-globe-line-v {
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(255, 255, 255, 0.25);
      transform: translateX(-50%);
    }
    .art-globe-line-h {
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      height: 1px;
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-50%);
    }

    /* --- CSS Art: Gray Laptop --- */
    .art-laptop {
      width: 56px;
      height: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .laptop-screen {
      width: 52px;
      height: 34px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 5px 5px 0 0;
      position: relative;
      backdrop-filter: blur(4px);
    }
    .laptop-screen::after {
      content: '';
      position: absolute;
      bottom: 2px; left: 50%;
      transform: translateX(-50%);
      width: 3px; height: 3px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
    }
    .laptop-base {
      width: 62px;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0 0 5px 5px;
    }

    /* --- Active View Containers --- */
    .content-view {
      display: none;
    }
    .content-view.active {
      display: block;
    }

    /* Liquid Glass Back Button */
    .back-btn {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%), rgba(20, 20, 20, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ccc;
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.05) 100%), rgba(30, 30, 30, 0.6);
      border-color: rgba(255, 255, 255, 0.3);
      color: #fff;
    }

    /* --- Search & Category Filters (Liquid Glass) --- */
    .input-c {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 0 auto 20px auto;
      max-width: 600px;
      width: 100%;
    }

    .input-c input, .input-c select {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%), rgba(20, 20, 20, 0.4);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 16px;
      border-radius: 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-c input { flex: 1; }

    .input-c input:focus, .input-c select:focus {
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
    }

    .input-c select option { background-color: #141414; color: #fff; }

    /* --- Games Grid Styling --- */
    .games-main-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      padding: 0;
      min-height: 400px;
    }

    .apps {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }

    /* Liquid Glass Game Cards */
    .game-card {
      width: 160px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%), rgba(20, 20, 20, 0.4);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 25px rgba(180, 180, 180, 0.1);
    }

    .game-card img {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 10px;
      margin-bottom: 10px;
      object-fit: cover;
      background: rgba(0, 0, 0, 0.3);
    }

    .game-card h3 {
      font-size: 14px;
      font-weight: 400;
      margin: 0;
      color: #ddd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- Cinematic In-Page Player Modal --- */
    #game-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 9999999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #game-modal.active { display: flex; }

    .modal-controls {
      width: 90%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-controls h2 { margin: 0; color: #eee; font-size: 18px; font-weight: 500; }

    .modal-controls button {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%), rgba(20, 20, 20, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ccc;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      margin-left: 8px;
      transition: all 0.2s ease;
    }
    .modal-controls button:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.05) 100%), rgba(30, 30, 30, 0.6);
      border-color: rgba(255, 255, 255, 0.3);
      color: #fff;
    }

    .modal-iframe-container {
      width: 90%;
      max-width: 1200px;
      height: 80vh;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%), rgba(10, 10, 10, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .modal-iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <!-- Left Sidebar Navbar Target -->
  <div class="f-nav"></div>

  <!-- Main Content Wrapper -->
  <div class="main-content">
    
    <!-- Initial Selection View -->
    <div id="selection-view">
      <h1>Choose your library</h1>
      <div class="choice-container">
        <!-- Hosted Choice Card -->
        <div class="choice-card" onclick="selectLibrary('hosted')">
          <div class="art-globe">
            <div class="art-globe-line-v"></div>
            <div class="art-globe-line-h"></div>
          </div>
          <h3>Hosted</h3>
          <p>Cloud SDK catalog</p>
        </div>

        <!-- Local Choice Card -->
        <div class="choice-card" onclick="selectLibrary('local')">
          <div class="art-laptop">
            <div class="laptop-screen"></div>
            <div class="laptop-base"></div>
          </div>
          <h3>Local</h3>
          <p>Local directories</p>
        </div>
      </div>
    </div>

    <!-- Local Games View -->
    <div id="local-view" class="content-view">
      <button class="back-btn" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i> Back to Selection</button>
      
      <div class="input-c">
        <input type="text" id="search" onkeyup="filterGames()" placeholder="Search library..." />
        <select id="category" name="category" onchange="filterGames()">
          <option value="all">All Games</option>
          <option value="flash">Classics / Flash</option>
          <option value="math">Trending</option>
          <option value="2P">Multiplayer</option>
          <option value="sports">Sports</option>
        </select>
      </div>

      <div class="games-main-wrapper">
        <div class="apps" id="apps-container"></div>
      </div>
    </div>

    <!-- Hosted Games View -->
    <div id="hosted-view" class="content-view">
      <button class="back-btn" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i> Back to Selection</button>
      <div id="games"></div>
    </div>

  </div>

  <!-- Cinematic Game Player Modal -->
  <div id="game-modal">
    <div class="modal-controls">
      <h2 id="modal-title">Game Title</h2>
      <div>
        <button onclick="toggleFullscreen()">Fullscreen</button>
        <button onclick="closeGame()" style="border-color: rgba(255, 100, 100, 0.3); color: #f88;">Close</button>
      </div>
    </div>
    <div class="modal-iframe-container">
      <iframe id="game-frame" src="" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Game Grid & View Switching Script -->
  <script>
    const gnGamesList = [
      { title: "The Binding of Isaac", slug: "binding-of-isaac", category: "flash" },
      { title: "Baldi's Basics", slug: "baldis-basics", category: "flash" },
      { title: "Minecraft 1.8.8", slug: "minecraft-1.8.8", category: "trending" }
    ];

    let luminInitialized = false;

    function selectLibrary(type) {
      document.getElementById('selection-view').classList.add('hidden');
      document.getElementById('local-view').classList.remove('active');
      document.getElementById('hosted-view').classList.remove('active');
      
      const targetView = document.getElementById(type + '-view');
      targetView.classList.add('active');
      
      if (type === 'local') {
        renderGrid();
      } else if (type === 'hosted') {
        if (!luminInitialized && typeof Lumin !== 'undefined') {
          Lumin.init({
            container: '#games',
            theme: 'dark'
          });
          luminInitialized = true;
        }
      }

      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function goHome() {
      document.getElementById('local-view').classList.remove('active');
      document.getElementById('hosted-view').classList.remove('active');
      document.getElementById('selection-view').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function renderGrid(filterCat = "all", searchQuery = "") {
      const appsContainer = document.getElementById('apps-container');
      if (!appsContainer) return;
      appsContainer.innerHTML = "";
      
      const localSvgFallback = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><rect width='150' height='150' fill='%23141414'/><text x='50%' y='50%' fill='%23888' font-family='sans-serif' font-size='12' text-anchor='middle' dominant-baseline='middle'>No Icon</text></svg>";

      gnGamesList.forEach(game => {
        const matchesSearch = game.title.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesCat = filterCat === "all" || game.category === filterCat;
        
        if (matchesSearch && matchesCat) {
          const card = document.createElement('div');
          card.className = 'game-card';
          const imgUrl = `/games/${game.slug}/icon.png`; 
          
          card.innerHTML = `
            <img src="${imgUrl}" alt="${game.title}" onerror="this.onerror=null; this.src='${localSvgFallback}';">
            <h3>${game.title}</h3>
          `;
          card.onclick = () => openGame(game.slug, game.title);
          appsContainer.appendChild(card);
        }
      });
    }

    window.filterGames = function() {
      const q = document.getElementById('search').value;
      const cat = document.getElementById('category').value;
      renderGrid(cat, q);
    };

    window.openGame = function(slug, title) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('game-frame').src = `/games/${slug}/index.html`;
      document.getElementById('game-modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    };

    window.closeGame = function() {
      document.getElementById('game-modal').classList.remove('active');
      document.getElementById('game-frame').src = "";
      document.body.style.overflow = 'auto';
    };

    window.toggleFullscreen = function() {
      const iframe = document.getElementById('game-frame');
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      goHome();
    });
  </script>

  <!-- Lumin SDK Scripts -->
  <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>

  <!-- Navbar & Utility Script Stack -->
  <script src="/assets/js/mg-pxy.js"></script>
  <script src="/assets/js/index-3.js"></script>
  <script src="/assets/mathematics/bundle.js?v=2025-04-15"></script>
  <script src="/assets/mathematics/config.js?v=2025-04-15"></script>
  <script src="/assets/js/m1.js"></script>
</body>

</html>
