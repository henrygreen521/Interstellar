<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <link rel="shortcut icon" id="tab-favicon" href="favicon.png" />
  <title id="t">Games - ChickenCoop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="/assets/css/global.css?v=6" />
  <link rel="stylesheet" href="/assets/css/container.css?v=2" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=01" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* --- iOS Liquid Glass Theme --- */
    body {
      background-color: #0b0b0b;
      color: #ffffff;
      font-family: inherit;
    }

    .f-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(25px) saturate(210%);
      -webkit-backdrop-filter: blur(25px) saturate(210%);
      background: rgba(20, 20, 20, 0.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .input-c {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 30px auto 20px auto;
      max-width: 600px;
      padding: 0 20px;
    }

    .input-c input, .input-c select {
      background: linear-gradient(
        135deg, 
        rgba(255, 255, 255, 0.12) 0%, 
        rgba(255, 255, 255, 0.03) 50%, 
        rgba(255, 255, 255, 0.06) 100%
      ), rgba(20, 20, 20, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 18px;
      border-radius: 16px;
      color: #fff;
      font-size: 15px;
      backdrop-filter: blur(25px) saturate(210%);
      -webkit-backdrop-filter: blur(25px) saturate(210%);
      box-shadow: 
        inset 0 1px 0 0 rgba(255, 255, 255, 0.25), 
        inset 0 -1px 0 0 rgba(255, 255, 255, 0.05),
        0 15px 35px rgba(0, 0, 0, 0.4);
      outline: none;
      transition: all 0.3s ease;
    }

    .input-c input:focus, .input-c select:focus {
      border-color: #ff5722;
      box-shadow: 0 0 15px rgba(255, 87, 34, 0.3), 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .input-c select option { background-color: #1a1a1a; color: #fff; }

    .games-main-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      min-height: 400px;
    }

    .apps {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    /* --- Liquid Glass Game Cards --- */
    .game-card {
      width: 180px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%), rgba(20, 20, 20, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .game-card:hover {
      transform: translateY(-6px);
      border-color: #ff5722;
      box-shadow: 0 15px 35px rgba(255, 87, 34, 0.3);
    }

    .game-card img {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 12px;
      margin-bottom: 12px;
      object-fit: cover;
      background: rgba(0,0,0,0.5);
    }

    .game-card h3 {
      font-size: 15px;
      margin: 0;
      color: #fff;
      font-family: inherit;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- Cinematic In-Page Player --- */
    #game-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      z-index: 9999999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #game-modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-controls {
      width: 90%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-controls h2 {
      margin: 0;
      color: #fff;
      font-size: 22px;
      letter-spacing: 1px;
    }

    .modal-controls button {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 24px;
      border-radius: 14px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: 0.3s;
      font-weight: bold;
      margin-left: 10px;
    }

    .modal-controls button:hover {
      background: #ff5722;
      border-color: #ff5722;
      box-shadow: 0 0 15px rgba(255, 87, 34, 0.5);
    }

    .modal-iframe-container {
      width: 90%;
      max-width: 1200px;
      height: 80vh;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      overflow: hidden;
      background: #000;
    }

    .modal-iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <div class="f-nav"></div>

  <!-- Search & Category Filters -->
  <div class="input-c">
    <input type="text" id="search" onkeyup="filterGames()" placeholder="Search library..." />
    <select id="category" onchange="filterGames()">
      <option value="all">All Games</option>
      <option value="math">Trending</option>
      <option value="2P">Multiplayer</option>
      <option value="flash">Classics</option>
      <option value="sports">Sports</option>
    </select>
  </div>

  <div class="games-main-wrapper">
    <div class="apps" id="apps-container"></div>
  </div>

  <!-- The Cinematic Liquid Glass Player Overlay -->
  <div id="game-modal">
    <div class="modal-controls">
      <h2 id="modal-title">Game Title</h2>
      <div>
        <button onclick="toggleFullscreen()">Fullscreen</button>
        <button onclick="closeGame()" style="background: rgba(255, 59, 48, 0.2); border-color: #ff3b30; color: #ff3b30;">Close Game</button>
      </div>
    </div>
    <div class="modal-iframe-container">
      <iframe id="game-frame" src="" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Build the Native Grid from GN-Math Endpoints -->
  <script>
    // The base URL where GN-Math hosts individual game files
    const gnBaseUrl = "https://genizymath.github.io/games/";

    // Your curated list of games. You can add as many as you want here!
    const gnGamesList = [
      { title: "Drive Mad", slug: "drive-mad", category: "math" },
      { title: "Monster Tracks", slug: "monster-tracks", category: "math" },
      { title: "1v1.LOL", slug: "1v1-lol", category: "2P" },
      { title: "Retro Bowl", slug: "retro-bowl", category: "sports" },
      { title: "Granny", slug: "granny", category: "flash" },
      { title: "Slope", slug: "slope", category: "math" },
      { title: "Baldi's Basics", slug: "baldis-basics", category: "flash" },
      { title: "BitLife", slug: "bitlife", category: "math" },
      { title: "Geometry Dash", slug: "geometry-dash", category: "math" },
      { title: "Ovo", slug: "ovo", category: "math" },
      { title: "Subway Surfers", slug: "subway-surfers", category: "math" },
      { title: "Minecraft", slug: "minecraft", category: "math" }
    ];

    const appsContainer = document.getElementById('apps-container');

    // Renders the game cards natively into the Liquid Glass UI
    function renderGrid(filterCat = "all", searchQuery = "") {
      appsContainer.innerHTML = "";
      
      gnGamesList.forEach(game => {
        const matchesSearch = game.title.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesCat = filterCat === "all" || game.category === filterCat;
        
        if (matchesSearch && matchesCat) {
          const card = document.createElement('div');
          card.className = 'game-card';
          
          // Grabs the image directly from GN-math or falls back to a placeholder
          const imgUrl = `https://genizymath.github.io/images/${game.slug}.png`;
          
          card.innerHTML = `
            <img src="${imgUrl}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/150/1a1a1a/ff5722?text=Game'">
            <h3>${game.title}</h3>
          `;
          
          // Triggers the cinematic overlay
          card.onclick = () => openGame(game.slug, game.title);
          appsContainer.appendChild(card);
        }
      });
    }

    // Runs once when the page loads
    renderGrid();

    // Handles the search bar and category dropdown
    function filterGames() {
      const q = document.getElementById('search').value;
      const cat = document.getElementById('category').value;
      renderGrid(cat, q);
    }

    // --- Cinematic Player Functions ---
    const modal = document.getElementById('game-modal');
    const iframe = document.getElementById('game-frame');

    function openGame(slug, title) {
      document.getElementById('modal-title').textContent = title;
      
      // Points the iframe directly to the GN-Math endpoint for that specific game
      iframe.src = gnBaseUrl + slug + "/"; 
      
      modal.classList.add('active');
      document.body.style.overflow = 'hidden'; // Prevents scrolling behind the game
    }

    function closeGame() {
      modal.classList.remove('active');
      iframe.src = ""; // Instantly kills the game audio/process
      document.body.style.overflow = 'auto';
    }

    function toggleFullscreen() {
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      }
    }
  </script>
</body>
</html>
