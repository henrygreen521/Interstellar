  <style>
    /* --- STAGE 0: THE GLITCH INTRO SCREEN --- */
    #glitch-intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: url('assets/media/icons/block.jpg') no-repeat center center fixed;
      background-size: cover;
      z-index: 1000000;
    }

    .glitch-active {
      animation: glitch-anim 0.4s steps(2, end) forwards;
    }

    @keyframes glitch-anim {
      0% {
        transform: translate(0, 0);
        filter: none;
      }
      20% {
        transform: translate(-12px, 6px);
        filter: hue-rotate(90deg) invert(1) contrast(200%);
      }
      40% {
        transform: translate(15px, -8px);
        opacity: 0.7;
        filter: blur(3px);
      }
      60% {
        transform: translate(-8px, 12px);
        filter: hue-rotate(180deg) saturate(300%);
      }
      80% {
        transform: translate(10px, -4px);
        opacity: 0.3;
      }
      100% {
        transform: translate(0, 0);
        opacity: 0;
        visibility: hidden;
      }
    }

    /* Splash Screen with Dynamic Gradient Sweep and Logo Glow Tracking */
    #coop-preload-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      /* Smooth 15% gradient blend band for a soft edge effect */
      background-image: linear-gradient(
        to right, 
        #ff5722 0%, 
        #ff5722 calc(var(--load-progress, 0%) - 7.5%), 
        #000000 calc(var(--load-progress, 0%) + 7.5%), 
        #000000 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #coop-preload-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .preload-logo {
      max-height: 80px;
      width: auto;
      object-fit: contain;
      /* Dynamic glow tracks the edge position via JavaScript (made slightly brighter) */
      filter: var(--logo-glow, drop-shadow(0 0 20px rgba(255, 87, 34, 0.7)));
      transition: filter 0.05s linear;
    }
    .progress-track {
      width: 260px;
      height: 16px;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid #ff5722;
      border-radius: 10px;
      overflow: hidden;
      padding: 2px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background-color: #ff5722;
      border-radius: 6px;
      transition: width 0.05s linear;
    }
    .loading-text {
      color: #ff5722;
      font-family: inherit;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    #splash {
      visibility: hidden;
    }
  </style>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    // 1. Glitch Intro Timer: Display block.jpg for 1.2s, then trigger glitch transition
    setTimeout(() => {
      const glitchScreen = document.getElementById('glitch-intro-screen');
      if (glitchScreen) {
        glitchScreen.classList.add('glitch-active');
        setTimeout(() => glitchScreen.remove(), 400);
      }
    }, 1200);

    // 2.5-Second Progress Bar & Synchronized Glow Tracking
    const duration = 2500;
    const startTime = performance.now();
    const overlay = document.getElementById('coop-preload-overlay');
    const fill = document.getElementById('progress-bar-fill');
    const percentText = document.getElementById('loading-percentage');
    const logoImg = document.getElementById('preload-logo-img');

    function updateProgress(currentTime) {
      const elapsed = currentTime - startTime;
      let progress = Math.min((elapsed / duration) * 100, 100);
      const rounded = Math.floor(progress);

      if (fill) fill.style.width = progress + '%';
      if (percentText) percentText.textContent = `Loading... [${rounded}]%`;
      if (overlay) overlay.style.setProperty('--load-progress', progress + '%');

      // Perfect Edge Tracking with brighter glow values
      if (logoImg) {
        if (progress < 42) {
          logoImg.style.filter = 'drop-shadow(0 0 22px rgba(255, 87, 34, 0.75))';
        } else if (progress <= 58) {
          logoImg.style.filter = 'drop-shadow(0 0 24px rgba(0, 0, 0, 0.85))';
        } else {
          logoImg.style.filter = 'drop-shadow(0 0 22px rgba(0, 0, 0, 0.75))';
        }
      }

      if (progress < 100) {
        requestAnimationFrame(updateProgress);
      } else {
        setTimeout(() => {
          if (overlay) {
            overlay.classList.add('fade-out');
            setTimeout(() => overlay.remove(), 400);
          }
        }, 150);
      }
    }
    requestAnimationFrame(updateProgress);

    // 1. Branding & Cloak Protection Script
    const text = 'follow "@jake_be_jakeing_it, @henrygreen521, @youmustbedeliskid and @joshgaming396 on tt" | thank @_mngoo for the logo | w coop';
    const logo = '<img src="/assets/media/icons/cooplogo2.webp" style="max-height: 90px;">';
    const faviconUrl = 'assets/media/favicon/cooplogo.png';

    setInterval(() => {
      const h1Title = document.querySelector('h1.title');
      if (h1Title && h1Title.innerHTML !== logo) h1Title.innerHTML = logo;
      
      const splash = document.getElementById('splash');
      if (splash) {
        if (splash.textContent !== text) splash.textContent = text;
        if (splash.style.visibility !== 'visible') splash.style.visibility = 'visible';
      }
      
      if (document.title !== 'ChickenCoop') {
        Object.defineProperty(document, 'title', {
          get: () => 'ChickenCoop',
          set: () => {}
        });
      }
      
      const titleTag = document.getElementById('t');
      if (titleTag && titleTag.textContent !== 'ChickenCoop') titleTag.textContent = 'ChickenCoop';

      let favicon = document.getElementById('tab-favicon') || document.querySelector("link[rel*='icon']");
      if (favicon && favicon.href !== faviconUrl) {
        favicon.href = faviconUrl;
      }
    }, 200);

    // 2. Larger Clock & Date Widget with built-in Seconds Toggle underneath
    let showSeconds = localStorage.getItem('coop_show_seconds') === 'true';

    const clockDiv = document.createElement('div');
    clockDiv.id = 'coop-clock';
    clockDiv.style.cssText = `
      position: fixed;
      top: 75px;
      right: 20px;
      background: rgba(20, 20, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 14px 20px;
      border-radius: 14px;
      color: #fff;
      font-family: inherit;
      z-index: 99999;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      text-align: right;
      transition: opacity 0.2s;
    `;
    clockDiv.innerHTML = `
      <div id="coop-time" style="font-weight: bold; font-size: 22px; letter-spacing: 0.5px;"></div>
      <div id="coop-date" style="font-size: 13px; color: #ccc; margin-top: 3px;"></div>
      <div style="margin-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 6px; display: flex; align-items: center; justify-content: flex-end; gap: 6px;">
        <span style="font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px;">Seconds</span>
        <label style="position: relative; display: inline-block; width: 32px; height: 18px; cursor: pointer;">
          <input type="checkbox" id="coop-sec-checkbox" ${showSeconds ? 'checked' : ''} style="opacity: 0; width: 0; height: 0;">
          <span style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .3s; border-radius: 18px; border: 1px solid rgba(255,255,255,0.15);"></span>
        </label>
      </div>
    `;
    document.body.appendChild(clockDiv);

    const sliderStyle = document.createElement('style');
    sliderStyle.innerHTML = `
      #coop-clock input:checked + span { background-color: #ff5722 !important; }
      #coop-clock input:checked + span:before { transform: translateX(14px); }
      #coop-clock span:before {
        position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%;
      }
    `;
    document.head.appendChild(sliderStyle);

    function updateClock() {
      const now = new Date();
      let timeOpts = { hour: 'numeric', minute: '2-digit', hour12: true };
      if (showSeconds) timeOpts.second = '2-digit';
      
      const timeString = now.toLocaleTimeString([], timeOpts);
      const dateString = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
      
      const timeEl = document.getElementById('coop-time');
      const dateEl = document.getElementById('coop-date');
      if (timeEl) timeEl.textContent = timeString;
      if (dateEl) dateEl.textContent = dateString;
    }
    setInterval(updateClock, 1000);
    updateClock();

    document.getElementById('coop-sec-checkbox').addEventListener('change', (e) => {
      showSeconds = e.target.checked;
      localStorage.setItem('coop_show_seconds', showSeconds);
      updateClock();
    });
  });
</script>

          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>

      `;
      navRight.appendChild(musicLink);
    }

    // Automatically strip out ONLY the unwanted default apps navbar link (leaving games alone)
    setTimeout(() => {
      document.querySelectorAll('.navbar-link, a').forEach(el => {
        const text = el.textContent.trim().toLowerCase();
        if (text === 'apps' || text === 'app') {
          el.remove();
        }
      });
    }, 50);
  });
</script>
  <script>
  // Block only the annoying startup alert prompt
  const originalAlert = window.alert;
  window.alert = function(msg) {
    if (typeof msg === 'string' && msg.toLowerCase().includes('popups')) {
      console.log("Suppressed startup popup warning.");
      return; // Silently swallows the startup warning
    }
    return originalAlert.apply(this, arguments);
  };

  // Automatically bypass or disable the automatic about:blank cloak check on load
  window.addEventListener('DOMContentLoaded', () => {
    localStorage.setItem('aboutBlank', 'false'); // Stops template from forcing it automatically
  });
</script>
