<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games - ChickenCoop</title>
  
  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="/assets/css/global.css?v=6" />
  <link rel="stylesheet" href="/assets/css/container.css?v=2" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=01" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background-color: #0b0b0b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Proper Navbar Wrapper to stop it from gluing to the top */
    .f-nav {
      width: 100%;
      position: relative;
      z-index: 1000;
    }

    .page-wrapper {
      padding-top: 15px;
    }

    .input-c {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px auto;
      max-width: 600px;
      padding: 0 20px;
    }

    .input-c input, .input-c select {
      background: rgba(20, 20, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 18px;
      border-radius: 16px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .input-c input { flex: 1; }
    .input-c select option { background-color: #1a1a1a; color: #fff; }

    .games-main-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .apps {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .game-card {
      width: 180px;
      border-radius: 20px;
      background: rgba(20, 20, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .game-card:hover {
      transform: translateY(-6px);
      border-color: #ff5722;
    }

    .game-card img {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 12px;
      margin-bottom: 12px;
      object-fit: cover;
      background: rgba(0,0,0,0.5);
    }

    .game-card h3 {
      font-size: 15px;
      margin: 0;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modal Player */
    #game-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 999999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #game-modal.active { display: flex; }

    .modal-controls {
      width: 90%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-controls h2 { margin: 0; color: #fff; font-size: 20px; }

    .modal-controls button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    .modal-iframe-container {
      width: 90%;
      max-width: 1200px;
      height: 80vh;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
      background: #000;
    }

    .modal-iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <!-- Navbar Injected Here -->
  <div class="f-nav"></div>

  <div class="page-wrapper">
    <!-- Search & Filters -->
    <div class="input-c">
      <input type="text" id="search" onkeyup="filterGames()" placeholder="Search library..." />
      <select id="category" name="category" onchange="filterGames()">
        <option value="all">All Games</option>
        <option value="flash">Classics / Flash</option>
        <option value="math">Trending</option>
      </select>
    </div>

    <!-- Games Grid -->
    <div class="games-main-wrapper">
      <div class="apps" id="apps-container"></div>
    </div>
  </div>

  <!-- Modal Player -->
  <div id="game-modal">
    <div class="modal-controls">
      <h2 id="modal-title">Game Title</h2>
      <div>
        <button onclick="toggleFullscreen()">Fullscreen</button>
        <button onclick="closeGame()" style="background: rgba(255, 59, 48, 0.3); border-color: #ff3b30;">Close</button>
      </div>
    </div>
    <div class="modal-iframe-container">
      <iframe id="game-frame" src="" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Navbar Script Only -->
  <script src="/assets/js/m1.js"></script>

  <!-- Game Grid Render Script -->
  <script>
    const gnGamesList = [
      { title: "The Binding of Isaac", slug: "binding-of-isaac", category: "flash" },
      { title: "Baldi's Basics", slug: "baldis-basics", category: "flash" }
    ];

    function renderGrid(filterCat = "all", searchQuery = "") {
      const appsContainer = document.getElementById('apps-container');
      if (!appsContainer) return;
      appsContainer.innerHTML = "";
      
      gnGamesList.forEach(game => {
        const matchesSearch = game.title.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesCat = filterCat === "all" || game.category === filterCat;
        
        if (matchesSearch && matchesCat) {
          const card = document.createElement('div');
          card.className = 'game-card';
          const imgUrl = `/games/${game.slug}/thumbnail.png`; 
          
          card.innerHTML = `
            <img src="${imgUrl}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/150/1a1a1a/ff5722?text=Game'">
            <h3>${game.title}</h3>
          `;
          card.onclick = () => openGame(game.slug, game.title);
          appsContainer.appendChild(card);
        }
      });
    }

    // Execute immediately so cards populate without waiting for hanging network events
    renderGrid();

    function filterGames() {
      const q = document.getElementById('search').value;
      const cat = document.getElementById('category').value;
      renderGrid(cat, q);
    }

    function openGame(slug, title) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('game-frame').src = `/games/${slug}/index.html`;
      document.getElementById('game-modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeGame() {
      document.getElementById('game-modal').classList.remove('active');
      document.getElementById('game-frame').src = "";
      document.body.style.overflow = 'auto';
    }

    function toggleFullscreen() {
      const iframe = document.getElementById('game-frame');
      if (iframe.requestFullscreen) iframe.requestFullscreen();
    }
  </script>
</body>
</html>
