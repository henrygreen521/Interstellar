<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" id="tab-favicon" href="favicon.png" />
  <title id="t">Coop Music</title>
  
  <link rel="stylesheet" href="/assets/css/global.css?v=6" />
  <link rel="stylesheet" href="/assets/css/h.css?v=01" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=01" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: inherit;
      margin: 0;
      overflow-x: hidden;
    }

    .music-main-wrapper {
      max-width: 1000px;
      margin: 100px auto 120px auto;
      padding: 20px;
    }

    .music-search-box {
      width: 100%;
      padding: 14px 20px;
      font-size: 16px;
      border-radius: 50px;
      border: 2px solid #ff5722;
      background: rgba(20, 20, 20, 0.9);
      color: #fff;
      outline: none;
      box-shadow: 0 4px 20px rgba(255, 87, 34, 0.2);
      transition: all 0.3s;
    }

    .music-search-box:focus {
      box-shadow: 0 4px 25px rgba(255, 87, 34, 0.5);
    }

    .tracks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .track-card {
      background: rgba(20, 20, 20, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .track-card:hover {
      transform: translateY(-4px);
      border-color: #ff5722;
    }

    .track-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #111;
    }

    .track-title {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 12px;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 10px;
    }

    .playlist-action-btn {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ccc;
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: 0.2s;
    }

    .playlist-action-btn:hover {
      background: #ff5722;
      color: #000;
      border-color: #ff5722;
    }

    /* Bottom Player Bar */
    .music-player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: rgba(10, 10, 10, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      box-sizing: border-box;
      z-index: 99999;
      backdrop-filter: blur(10px);
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 30%;
    }

    .player-left img {
      width: 50px;
      height: 50px;
      border-radius: 6px;
      object-fit: cover;
      display: none;
    }

    .player-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 40%;
    }

    .play-pause-btn {
      background: #ff5722;
      color: #000;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-right {
      width: 30%;
      text-align: right;
      font-size: 13px;
      color: #aaa;
    }

    /* Auth Modal */
    #authModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999999;
    }
    .auth-card {
      background: #181818;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 30px;
      border-radius: 14px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .auth-card input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      box-sizing: border-box;
      outline: none;
    }
    .auth-card input:focus {
      border-color: #ff5722;
    }
    .auth-submit {
      background: #ff5722;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <!-- Standard Navigation Bar Container -->
  <div class="f-nav"></div>

  <div id="particles-js">
    <div class="music-main-wrapper">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="margin: 0; font-size: 26px; color: #ff5722;">Coop Music</h1>
        <button id="accountBtn" onclick="openAuth()" style="background: transparent; border: 1px solid #ff5722; color: #ff5722; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">Login</button>
      </div>

      <input type="text" id="musicInput" class="music-search-box" placeholder="Search tracks or artists and press Enter..." autocomplete="off" />
      
      <div class="tracks-grid" id="grid">
        <p style="color: #666;">Search for your favorite music above...</p>
      </div>
    </div>
  </div>

  <!-- Persistent Bottom Player -->
  <div class="music-player-bar">
    <div class="player-left">
      <img id="playerThumb" src="" alt="" />
      <div>
        <div id="playerTitle" style="font-weight: bold; font-size: 13px;">Select a track</div>
        <div id="playerArtist" style="font-size: 11px; color: #888;">-</div>
      </div>
    </div>
    <div class="player-center">
      <button class="play-pause-btn" id="playBtn" onclick="togglePlay()">▶</button>
    </div>
    <div class="player-right" id="userStatusDisplay">
      Guest Mode
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal">
    <div class="auth-card">
      <h3 id="authTitle" style="margin:0; text-align:center;">Coop Account</h3>
      <p id="authErr" style="color:#ff5722; font-size:12px; text-align:center; margin:0;"></p>
      <input type="text" id="authU" placeholder="Username" autocomplete="off" />
      <input type="password" id="authP" placeholder="Password" />
      <button class="auth-submit" id="authSubmit" onclick="submitAuth()">Log In</button>
      <div style="text-align:center; font-size:12px; color:#aaa; cursor:pointer;" onclick="switchAuthMode()">
        Need an account? <span id="authSwitch" style="color:#ff5722; text-decoration:underline;">Register</span>
      </div>
      <div style="text-align:center; font-size:11px; color:#666; cursor:pointer;" onclick="closeAuth()">Cancel</div>
    </div>
  </div>

  <audio id="audioEl"></audio>

  <!-- Navigation Injection Script with Explicit Inherited Styling -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const navRight = document.querySelector('.f-nav-right') || document.querySelector('.f-nav');
      if (navRight && !document.getElementById('coopNavAdded')) {
        const wrap = document.createElement('div');
        wrap.id = 'coopNavAdded';
        wrap.style.cssText = "display: flex; align-items: center; gap: 14px; margin-left: auto;";
        
        wrap.innerHTML = `
          <a class="navbar-link" href="https://chickencoopproxy.vercel.app" style="color: inherit; text-decoration: none; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='#ff5722'" onmouseout="this.style.color='inherit'">
            <svg class="navbar-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:inline-block; vertical-align:-2px; margin-right:4px;"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>HOME
          </a>
          <a class="navbar-link" href="/music.html" style="color: inherit; text-decoration: none; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='#ff5722'" onmouseout="this.style.color='inherit'">
            <svg class="navbar-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:inline-block; vertical-align:-2px; margin-right:4px;"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>MUSIC
          </a>
        `;
        navRight.appendChild(wrap);
      }
    });
  </script>

  <!-- Core Functionality Script -->
  <script>
    const API_BASE = "https://chickencoop-chat-server.onrender.com";
    const audio = document.getElementById('audioEl');
    const playBtn = document.getElementById('playBtn');
    const input = document.getElementById('musicInput');
    const grid = document.getElementById('grid');

    let currentUser = JSON.parse(localStorage.getItem('chickencoop_user')) || null;
    let isReg = false;

    function checkSession() {
      const btn = document.getElementById('accountBtn');
      const status = document.getElementById('userStatusDisplay');
      if (currentUser) {
        btn.innerText = currentUser.username;
        btn.onclick = logout;
        status.innerHTML = `<span style="color:#ff5722;">@${currentUser.username}</span>`;
      } else {
        btn.innerText = 'Login';
        btn.onclick = openAuth;
        status.innerHTML = `Guest Mode`;
      }
    }
    checkSession();

    function openAuth() { document.getElementById('authModal').style.display = 'flex'; }
    function closeAuth() { document.getElementById('authModal').style.display = 'none'; }
    function switchAuthMode() {
      isReg = !isReg;
      document.getElementById('authTitle').innerText = isReg ? 'Create Coop Account' : 'Coop Account';
      document.getElementById('authSubmit').innerText = isReg ? 'Register' : 'Log In';
      document.getElementById('authSwitch').innerText = isReg ? 'Log In' : 'Register';
    }

    async function submitAuth() {
      const u = document.getElementById('authU').value.trim();
      const p = document.getElementById('authP').value.trim();
      const err = document.getElementById('authErr');
      if (!u || !p) { err.innerText = 'Fill out all fields'; return; }

      try {
        const res = await fetch(`${API_BASE}${isReg ? '/api/register' : '/api/login'}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (!res.ok) { err.innerText = data.error || 'Failed'; return; }

        currentUser = isReg ? { id: data.userId, username: u } : data.user;
        localStorage.setItem('chickencoop_user', JSON.stringify(currentUser));
        closeAuth();
        checkSession();
      } catch(e) { err.innerText = 'Server error'; }
    }

    function logout() {
      localStorage.removeItem('chickencoop_user');
      currentUser = null;
      checkSession();
    }

    input.addEventListener('keypress', async (e) => {
      if (e.key === 'Enter') {
        const q = input.value.trim();
        if (!q) return;
        grid.innerHTML = '<p style="color:#888;">Searching tracks...</p>';

        try {
          const res = await fetch(`${API_BASE}/api/music/search?q=${encodeURIComponent(q)}`);
          const data = await res.json();
          const tracks = data.tracks || data.results || [];
          
          grid.innerHTML = '';
          if (tracks.length === 0) {
            grid.innerHTML = '<p style="color:#888;">No tracks found.</p>';
            return;
          }

          tracks.forEach(t => {
            const card = document.createElement('div');
            card.className = 'track-card';
            card.innerHTML = `
              <img src="${t.thumbnail || t.cover || ''}" alt="">
              <div class="track-title">${t.title}</div>
              <div class="track-artist">${t.artist || t.channelTitle || 'Unknown'}</div>
              <button class="playlist-action-btn" onclick="event.stopPropagation(); alert('Playlist features require an active database playlist connection!')">+ Add to Playlist</button>
            `;
            card.onclick = () => playSong(t.streamUrl || t.url, t.title, t.artist || t.channelTitle, t.thumbnail || t.cover);
            grid.appendChild(card);
          });
        } catch (err) {
          grid.innerHTML = '<p style="color:#ff5722;">Search failed. Try another term.</p>';
        }
      }
    });

    async function playSong(url, title, artist, thumb) {
      if (!url) { alert('Stream URL unavailable'); return; }
      audio.src = `${API_BASE}/api/music/stream?url=${encodeURIComponent(url)}`;
      try {
        await audio.play();
        playBtn.innerText = '⏸';
      } catch (e) { console.error(e); }

      const img = document.getElementById('playerThumb');
      if (thumb) { img.src = thumb; img.style.display = 'block'; }
      document.getElementById('playerTitle').innerText = title;
      document.getElementById('playerArtist').innerText = artist || 'Unknown';
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playBtn.innerText = '⏸';
      } else {
        audio.pause();
        playBtn.innerText = '▶';
      }
    }
  </script>
</body>

</html>
